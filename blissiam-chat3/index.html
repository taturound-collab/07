<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomGI - พื้นที่แบ่งปันน้ำใจ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                    colors: {
                        paper: {
                            50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)',
                            200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)'
                        },
                        ink: {
                            900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)',
                            400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)'
                        },
                        surface: 'var(--color-surface)',
                        primary: {
                            50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)', 400: 'var(--color-primary-400)', 500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)'
                        },
                        secondary: {
                            50: 'var(--color-secondary-50)', 100: 'var(--color-secondary-100)', 200: 'var(--color-secondary-200)',
                            300: 'var(--color-secondary-300)', 400: 'var(--color-secondary-400)', 500: 'var(--color-secondary-500)',
                            600: 'var(--color-secondary-600)'
                        },
                        line: 'var(--color-line)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-100: #e3ece0; --color-primary-200: #c5dcc0;
            --color-primary-300: #9dc295; --color-primary-400: #739e6b; --color-primary-500: #4D7355;
            --color-primary-600: #3d5d44; --color-primary-700: #314936;
            --color-secondary-50: #fbf3ea; --color-secondary-100: #f3e0c8; --color-secondary-200: #e6bf8e;
            --color-secondary-300: #cc9655; --color-secondary-400: #A8662A; --color-secondary-500: #925621; --color-secondary-600: #74441a;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #9c9c9c; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
    </style>
    <script src="theme.js"></script>
    <script src="pwa.js"></script>
    <script src="mood.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--color-paper-50);
            /* ใช้รูปเดียวกับ hero เป็นพื้นหลังทั้งหน้า + overlay สีกระดาษ (paper-50)
               ที่ปรับตามโหมดสว่าง/มืดเอง ให้เนื้อหายังอ่านชัด */
            background-image:
                linear-gradient(color-mix(in srgb, var(--color-paper-50) 88%, transparent), color-mix(in srgb, var(--color-paper-50) 88%, transparent)),
                url('assets/hero-bg.jpg');
            background-size: cover, cover;
            background-position: center, center 30%;
            background-attachment: fixed, fixed;
            transition: background-color 0.3s ease;
        }
        .watermark { font-size: 13rem; font-weight: 800; color: var(--color-ink-900); opacity: 0.045; letter-spacing: -0.02em; white-space: nowrap; user-select: none; }
        @media (max-width: 768px) { .watermark { font-size: 6rem; } }
        .fade-in { animation: fadeIn 0.7s ease-out forwards; opacity: 0; transform: translateY(16px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .role-card { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .role-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.12); }
        .dot-pulse circle { animation: dotPulse 1.4s ease-in-out infinite; }
        .dot-pulse circle:nth-child(1) { animation-delay: 0s; }
        .dot-pulse circle:nth-child(2) { animation-delay: 0.1s; }
        .dot-pulse circle:nth-child(3) { animation-delay: 0.2s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .scroll-row { scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }
        .hero-photo {
            background-image: url('assets/hero-bg.jpg');
            background-size: cover;
            background-position: center 30%;
            left: 0; right: 0; top: -30%; height: 160%;
            will-change: transform;
        }
        .hero-overlay {
            background: linear-gradient(180deg, var(--color-paper-50) 0%, color-mix(in srgb, var(--color-paper-50) 60%, transparent) 45%, color-mix(in srgb, var(--color-paper-50) 60%, transparent) 65%, var(--color-paper-50) 100%);
        }
        .hero-fullscreen {
            min-height: 100vh;
            min-height: 100dvh;
        }
        @keyframes blobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -25px) scale(1.05); } 66% { transform: translate(-15px, 15px) scale(0.96); } }
        .blob { position: absolute; border-radius: 50%; filter: blur(40px); animation: blobFloat 12s ease-in-out infinite; pointer-events: none; }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        .wiggle-hover:hover { animation: wiggle 0.4s ease-in-out; }
        .btn-playful { border-radius: 9999px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-600)); box-shadow: 0 8px 20px -6px var(--color-primary-500); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-playful:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 26px -6px var(--color-primary-500); }
        .btn-playful:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .card-playful { border-radius: 2rem; box-shadow: 0 20px 45px -20px var(--color-primary-500); border: 1px solid color-mix(in srgb, var(--color-primary-500) 15%, var(--color-line)); }
    </style>
</head>
<body class="min-h-screen text-ink-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = window.supabaseClient;

        const TOPICS = [
            { id: 'general', label: 'เรื่องทั่วไป 💬', desc: 'คุยสบายๆ ได้ทุกเรื่องทั่วไป' },
            { id: 'study', label: 'การเรียน/มหาลัย 📚', desc: 'เครียดเรียน ปรึกษาเรื่องเรียน' },
            { id: 'love', label: 'ความรัก ❤️', desc: 'อกหัก แอบชอบ ความสัมพันธ์' },
            { id: 'work', label: 'การทำงาน 💼', desc: 'ปัญหาที่ทำงาน หมดไฟ ท้อแท้' },
            { id: 'family', label: 'ครอบครัว 🏠', desc: 'เรื่องไม่สบายใจในบ้าน' },
            { id: 'health', label: 'สุขภาพจิต 🧠', desc: 'เหนื่อยล้า ต้องการกำลังใจเยียวยา' }
        ];

        const SUPPORT_TYPES = [
            { id: 'listen',  emoji: '👂', label: 'แค่อยากให้ฟัง', desc: 'ไม่ต้องแนะนำ ขอแค่มีคนรับฟัง' },
            { id: 'advice',  emoji: '💡', label: 'อยากได้คำแนะนำ', desc: 'อยากได้มุมมอง/ทางออกด้วย' },
            { id: 'company', emoji: '🫂', label: 'อยากมีคนอยู่เป็นเพื่อน', desc: 'ไม่ต้องพิมพ์เยอะ ขอแค่ไม่เหงา' },
        ];

        function DotLogo({ size = 28, animated = false }) {
            return (
                <svg width={size} height={size} viewBox="0 0 28 28" fill="none" class={animated ? 'dot-pulse' : ''}>
                    <circle cx="4" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="4" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="14" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="14" r="3" fill="var(--color-primary-500)"/><circle cx="24" cy="14" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="24" r="3" fill="var(--color-ink-900)"/>
                </svg>
            );
        }

        function DarkModeToggle({ isDark, onToggle }) {
            return (
                <button type="button" onClick={onToggle} title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    class="w-9 h-9 rounded-full flex items-center justify-center border border-line hover:border-primary-400 transition text-ink-700 hover:text-primary-600">
                    {isDark ? (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    ) : (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    )}
                </button>
            );
        }

        // #7 เช็คอินความรู้สึกรายวัน + streak (ต้นไม้โตแม้ไม่ได้แชท) — เก็บ localStorage
        function DailyCheckIn() {
            const Mood = window.NomGIMood;
            const [done, setDone] = useState(() => { try { return Mood ? Mood.checkedInToday() : true; } catch(e){ return true; } });
            const [streak, setStreak] = useState(() => { try { return Mood ? Mood.streak() : 0; } catch(e){ return 0; } });
            if (!Mood) return null;
            function pick(score) {
                const s = Mood.dailyCheckIn(score);
                setStreak(s); setDone(true);
                // ส่ง mood แบบไม่ระบุตัวตนเข้ากองรวมของชุมชน (#11) — ไม่มี user_id
                try { window.supabaseClient?.from('mood_pings').insert({ score }).then(() => {}, () => {}); } catch (e) {}
            }
            return (
                <div class="mb-6 bg-gradient-to-br from-primary-50 to-surface border border-line rounded-3xl p-5 sm:p-6">
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="font-bold text-base text-ink-900">เช็คอินความรู้สึกวันนี้ 🌤️</h3>
                        {streak > 0 && <span class="text-sm font-bold text-primary-600 flex items-center gap-1">🔥 {streak} วันติด</span>}
                    </div>
                    {done ? (
                        <p class="text-sm text-ink-500 mt-1">เช็คอินวันนี้แล้ว · แวะมาใหม่พรุ่งนี้เพื่อรักษาสถิตินะ 🌱</p>
                    ) : (
                        <>
                            <p class="text-xs text-ink-400 mb-3">แตะบอกความรู้สึกวันนี้ (ส่วนตัว เห็นแค่คุณ) — เช็คอินทุกวันให้ต้นไม้น้ำใจเติบโต</p>
                            <div class="flex justify-between gap-1">
                                {(Mood.MOODS || []).map(m => (
                                    <button key={m.score} type="button" onClick={() => pick(m.score)}
                                        class="flex-1 flex flex-col items-center gap-1 py-2 rounded-2xl hover:bg-primary-50 transition active:scale-90">
                                        <span class="text-3xl">{m.emoji}</span>
                                        <span class="text-[10px] text-ink-400">{m.label}</span>
                                    </button>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // สมุดขอบคุณ / คำถามประจำวัน — "วันนี้มีอะไรดีๆ 1 อย่าง?"
        function GratitudeToday() {
            const Mood = window.NomGIMood;
            const [done, setDone] = useState(() => { try { return Mood ? Mood.gratitudeToday() : true; } catch(e){ return true; } });
            const [text, setText] = useState('');
            if (!Mood) return null;
            function save() {
                if (!text.trim()) return;
                Mood.addGratitude(text); setDone(true); setText('');
            }
            return (
                <div class="mb-6 bg-surface border border-line rounded-3xl p-5 sm:p-6">
                    <h3 class="font-bold text-base text-ink-900 mb-1">วันนี้มีอะไรดีๆ 1 อย่าง? 🌷</h3>
                    {done ? (
                        <p class="text-sm text-ink-500 mt-1">บันทึกความขอบคุณของวันนี้แล้ว · ดูย้อนหลังได้ในโปรไฟล์</p>
                    ) : (
                        <>
                            <p class="text-xs text-ink-400 mb-3">จดสิ่งเล็กๆ ที่ทำให้ยิ้มได้วันนี้ (ส่วนตัว เห็นแค่คุณ)</p>
                            <div class="flex gap-2">
                                <input type="text" value={text} onChange={e => setText(e.target.value.slice(0,300))}
                                    onKeyDown={e => { if (e.key === 'Enter') save(); }}
                                    placeholder="เช่น ได้กินของอร่อย, มีคนทักทาย..."
                                    class="flex-1 bg-paper-50 border border-line rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 placeholder:text-ink-300" />
                                <button type="button" onClick={save} disabled={!text.trim()}
                                    class="px-4 rounded-2xl bg-primary-500 text-white text-sm font-semibold disabled:opacity-40 hover:bg-primary-600 transition">บันทึก</button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // Onboarding ครั้งแรก — 3 สไลด์
        const ONBOARD_SLIDES = [
            { icon: '🎭', title: 'เลือกได้ว่าจะเปิดเผยตัวตนไหม', desc: 'คุยแบบไม่ระบุตัวตน (ใช้ชื่อสมมติ) หรือระบุตัวตนก็ได้ — เลือกก่อนจับคู่ทุกครั้ง' },
            { icon: '👥', title: 'คุย 1:1 หรือเข้าวงกลมแบ่งปัน', desc: 'จับคู่คุยส่วนตัว หรือเข้าห้องกลุ่มเล็กๆ ตามหัวข้อที่สนใจ' },
            { icon: '🌳', title: 'ยิ่งแบ่งปันน้ำใจ ต้นไม้ยิ่งโต', desc: 'ทุกครั้งที่รับฟัง-ให้กำลังใจกัน จะได้น้ำใจสะสม ต้นไม้ในโปรไฟล์จะเติบโตและออกดอก' },
        ];
        function Onboarding() {
            const [show, setShow] = useState(() => { try { return !localStorage.getItem('nomgi_onboarded'); } catch(e){ return false; } });
            const [i, setI] = useState(0);
            if (!show) return null;
            const s = ONBOARD_SLIDES[i];
            const last = i === ONBOARD_SLIDES.length - 1;
            function close() { try { localStorage.setItem('nomgi_onboarded', '1'); } catch(e){} setShow(false); }
            return (
                <div class="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
                    <div class="relative w-full sm:max-w-md bg-surface rounded-3xl shadow-2xl border border-line overflow-hidden">
                        <div class="p-8 text-center">
                            <div class="text-5xl mb-4">{s.icon}</div>
                            <h3 class="text-xl font-extrabold text-ink-900 mb-2">{s.title}</h3>
                            <p class="text-sm text-ink-500 leading-relaxed">{s.desc}</p>
                            <div class="flex justify-center gap-1.5 my-5">
                                {ONBOARD_SLIDES.map((_, k) => (
                                    <span key={k} class={`h-2 rounded-full transition-all ${k === i ? 'w-6 bg-primary-500' : 'w-2 bg-paper-200'}`}></span>
                                ))}
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onClick={close} class="flex-1 py-3 rounded-2xl border border-line text-sm font-medium text-ink-500 hover:bg-paper-100 transition">ข้าม</button>
                                <button type="button" onClick={() => last ? close() : setI(i + 1)}
                                    class="flex-1 py-3 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white text-sm font-semibold hover:brightness-105 transition">
                                    {last ? 'เริ่มเลย!' : 'ถัดไป →'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // วงกลมแบ่งปันแบบมีเวลานัด — ทุกคืนวันอาทิตย์ 20:00–22:00 (client-side)
        function scheduledCircleInfo() {
            const now = new Date();
            const day = now.getDay();   // 0 = อาทิตย์
            const hour = now.getHours();
            const open = (day === 0 && hour >= 20 && hour < 22);
            const next = new Date(now);
            next.setHours(20, 0, 0, 0);
            let add = (7 - day) % 7;
            if (day === 0 && hour >= 22) add = 7;
            next.setDate(now.getDate() + add);
            return { open, topic: 'health', next };
        }
        function ScheduledCircle({ onJoin, starting }) {
            const [, setTick] = useState(0);
            useEffect(() => { const iv = setInterval(() => setTick(t => t + 1), 30000); return () => clearInterval(iv); }, []);
            const info = scheduledCircleInfo();
            const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
            const nextText = info.next.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short' }) + ' เวลา 20:00 น.';
            return (
                <div class={`mt-4 rounded-3xl overflow-hidden border ${info.open ? 'border-primary-400' : 'border-line'}`}
                    style={{ background: info.open ? 'linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700))' : 'var(--color-surface)' }}>
                    <div class="p-5 sm:p-6 flex items-center gap-4">
                        <div class={`w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shrink-0 ${info.open ? 'bg-white/20' : 'bg-primary-50'}`}>🌙</div>
                        <div class="min-w-0 flex-1">
                            <div class={`font-extrabold text-base ${info.open ? 'text-white' : 'text-ink-900'}`}>วงกลมสุขภาพใจ · คืนวันอาทิตย์</div>
                            {info.open ? (
                                <div class="text-sm text-white/90">เปิดอยู่ตอนนี้! มาคุยเรื่องสุขภาพจิตเป็นกลุ่มกัน 🌿</div>
                            ) : (
                                <div class="text-sm text-ink-500">รอบถัดไป: {nextText}</div>
                            )}
                        </div>
                        {info.open && (
                            <button onClick={() => onJoin(info.topic)} disabled={starting}
                                class="shrink-0 px-4 py-2.5 rounded-full bg-white text-primary-600 text-sm font-bold hover:brightness-95 transition disabled:opacity-50">
                                เข้าร่วม
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [starting, setStarting] = useState(false);
            const [identityMode, setIdentityMode] = useState('anonymous');
            const [selectedTopic, setSelectedTopic] = useState('general');
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            const [moodRole, setMoodRole] = useState(null); // เปิด mood check-in ก่อนเข้าคิว (#4)
            const [selectedSupport, setSelectedSupport] = useState('listen'); // #2 แบบที่อยากให้ช่วย

            useEffect(() => {
                checkUser();
                window.BlissiamTheme?.loadAndApplyTheme();
                const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
                    setUser(session?.user || null);
                    if (session?.user) loadProfile(session.user.id);
                    else setProfile(null);
                });
                return () => listener.subscription.unsubscribe();
            }, []);

            // Parallax: ให้รูป hero เลื่อนตามการ scroll (ช้ากว่าเนื้อหา สร้างมิติ)
            useEffect(() => {
                let raf = null;
                const update = () => {
                    raf = null;
                    const el = document.querySelector('.hero-photo');
                    if (!el) return;
                    const hero = el.parentElement;
                    const y = Math.min(window.scrollY, hero ? hero.offsetHeight : window.innerHeight);
                    el.style.transform = `translate3d(0, ${y * 0.28}px, 0)`;
                };
                const onScroll = () => { if (raf == null) raf = requestAnimationFrame(update); };
                window.addEventListener('scroll', onScroll, { passive: true });
                update();
                return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
            }, [loading]);

            async function checkUser() {
                const { data: { session } } = await supabase.auth.getSession();
                setUser(session?.user || null);
                if (session?.user) await loadProfile(session.user.id);
                setLoading(false);
            }

            async function loadProfile(userId) {
                const { data } = await supabase.from('profiles').select('display_name, status').eq('id', userId).single();
                setProfile(data);
            }

            async function logout() {
                await supabase.auth.signOut();
            }

            function toggleDarkMode() {
                const resolved = window.BlissiamTheme?.toggleColorScheme();
                setIsDark(resolved === 'dark');
            }

            function startWithRole(role) {
                if (!user) {
                    window.location.href = `login.html?redirect=queue.html&role=${role}&identity=${identityMode}&topic=${selectedTopic}&support=${selectedSupport}`;
                    return;
                }
                setMoodRole(role); // เปิด mood check-in ก่อน แล้วค่อยเข้าคิว
            }

            // #6 เข้าวงกลมแบ่งปัน (ห้องกลุ่มตามหัวข้อ)
            async function joinGroupRoom() {
                if (!user) { window.location.href = 'login.html?redirect=index.html'; return; }
                setStarting(true);
                try {
                    const { data, error } = await supabase.rpc('join_group', { p_topic: selectedTopic });
                    if (error) throw error;
                    window.location.href = 'group.html?g=' + data;
                } catch (err) {
                    alert('เข้าวงกลมไม่สำเร็จ: ' + (err.message || err) + '\n\n(ถ้าเพิ่งเพิ่มฟีเจอร์นี้ ต้องรันไฟล์ supabase-group-rooms.sql ใน Supabase ก่อน)');
                    setStarting(false);
                }
            }

            async function joinScheduledCircle(topic) {
                if (!user) { window.location.href = 'login.html?redirect=index.html'; return; }
                setStarting(true);
                try {
                    const { data, error } = await supabase.rpc('join_group', { p_topic: topic });
                    if (error) throw error;
                    window.location.href = 'group.html?g=' + data;
                } catch (err) { alert('เข้าวงกลมไม่สำเร็จ: ' + (err.message || err)); setStarting(false); }
            }

            // เลือกความรู้สึกก่อนเข้าคิว (บันทึกส่วนตัว) แล้วเข้าคิว — ข้ามได้
            async function proceedToQueue(role, moodScore) {
                if (moodScore) { try { window.NomGIMood?.setPending(moodScore); } catch (e) {} }
                setMoodRole(null);
                setStarting(true);
                try {
                    await supabase.from('profiles').update({
                        role_preference: role,
                        status: 'waiting',
                        last_seen: new Date().toISOString()
                    }).eq('id', user.id);
                    window.location.href = `queue.html?role=${role}&identity=${identityMode}&topic=${selectedTopic}&support=${selectedSupport}`;
                } catch (err) {
                    alert('เกิดข้อผิดพลาด: ' + err.message);
                    setStarting(false);
                }
            }

            if (loading) return (
                <div class="min-h-screen flex items-center justify-center bg-paper-50">
                    <DotLogo size={40} animated={true} />
                </div>
            );

            const isAdmin = profile?.status === 'admin';

            return (
                <div class="relative min-h-screen">
                    <Onboarding />
                    {/* Navbar */}
                    <nav class="sticky top-0 w-full z-50 bg-paper-50 border-b border-line px-6 py-4">
                        <div class="max-w-6xl mx-auto flex justify-between items-center">
                            <a href="index.html" class="flex items-center gap-3">
                                <DotLogo />
                                <span class="text-xl font-bold tracking-tight">NomGI</span>
                            </a>
                            <div class="flex items-center gap-4">
                                <DarkModeToggle isDark={isDark} onToggle={toggleDarkMode} />
                                {user && profile ? (
                                    <>
                                        <a href="profile.html" class="text-sm text-ink-700 hover:text-primary-600 transition font-medium hidden sm:inline">
                                            สวัสดี, {profile.display_name}
                                        </a>
                                        <button onClick={logout} class="text-sm text-ink-700 hover:text-primary-600 transition font-medium">
                                            ออกจากระบบ
                                        </button>
                                    </>
                                ) : (
                                    <>
                                        <a href="login.html" class="text-sm text-ink-700 hover:text-primary-600 transition font-medium">
                                            เข้าสู่ระบบ
                                        </a>
                                        <a href="signup.html" class="btn-playful text-sm text-white px-5 py-2.5 font-semibold">
                                            สร้างบัญชี
                                        </a>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section class="hero-fullscreen relative flex flex-col items-center justify-center px-6 overflow-hidden">
                        <div class="absolute z-0 hero-photo"></div>
                        <div class="absolute inset-0 z-0 hero-overlay"></div>
                        <div class="absolute top-8 left-1/2 -translate-x-1/2 pointer-events-none select-none z-[1]">
                            <span class="watermark">NOMGI</span>
                        </div>
                        <div class="max-w-3xl mx-auto text-center relative z-10 fade-in">
                            <div class="inline-flex items-center gap-2 text-primary-600 text-xs font-semibold uppercase tracking-widest mb-4">
                                <span class="w-1.5 h-1.5 rounded-full bg-primary-500"></span>
                                พื้นที่ปลอดภัย · ไม่ระบุตัวตน · ฟรี
                            </div>
                            <h1 class="text-5xl md:text-6xl font-black leading-[1.1] mb-4">
                                พื้นที่แบ่งปันน้ำใจ <span class="wiggle-hover inline-block">✨</span>
                            </h1>
                            <p class="text-base text-ink-500 max-w-xl mx-auto leading-relaxed">
                                ไม่ว่าจะเป็นใคร อยู่ที่ไหน ไม่ว่าจะกี่โมง มีคนพร้อมรับฟังคุณอยู่เสมอ
                            </p>
                        </div>
                        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 animate-bounce pointer-events-none">
                            <svg class="w-6 h-6 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
                        </div>
                    </section>

                    {/* Configuration & Selection Panel */}
                    <section class="px-6 pb-20">
                        <div class="max-w-6xl mx-auto">
                            {!isAdmin && <DailyCheckIn />}
                            {!isAdmin && <GratitudeToday />}
                            {!isAdmin && (
                                <div class="mb-8 bg-surface border border-line rounded-3xl p-6 sm:p-8 shadow-sm">
                                    {/* 1. เลือกหัวข้อสนทนา */}
                                    <div class="mb-6">
                                        <div class="flex items-center justify-between mb-3">
                                            <h3 class="font-bold text-base text-ink-900 flex items-center gap-2.5">
                                                <span class="w-6 h-6 rounded-full bg-primary-500 text-white text-xs font-bold flex items-center justify-center shrink-0">1</span>
                                                เลือกเรื่องราวที่คุณสนใจหรืออยากพูดคุย
                                            </h3>
                                            <span class="text-xs text-primary-600 font-medium hidden sm:inline">ระบบจะจับคู่ตามเรื่องที่เลือก</span>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {TOPICS.map(t => (
                                                <button
                                                    key={t.id}
                                                    onClick={() => setSelectedTopic(t.id)}
                                                    class={`text-left p-4 rounded-2xl border-2 transition ${selectedTopic === t.id ? 'border-primary-500 bg-primary-50/30' : 'border-line hover:border-ink-200'}`}
                                                >
                                                    <div class="font-semibold text-sm text-ink-900 mb-0.5">{t.label}</div>
                                                    <div class="text-xs text-ink-500">{t.desc}</div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 2. เลือกโหมดระบุตัวตน */}
                                    <div class="border-t border-line pt-6">
                                        <div class="flex items-center justify-between mb-3">
                                            <h3 class="font-bold text-base text-ink-900 flex items-center gap-2.5">
                                                <span class="w-6 h-6 rounded-full bg-primary-500 text-white text-xs font-bold flex items-center justify-center shrink-0">2</span>
                                                เลือกโหมดการแสดงตัวตน
                                            </h3>
                                        </div>
                                        <div class="grid grid-cols-2 gap-4">
                                            <button
                                                onClick={() => setIdentityMode('anonymous')}
                                                class={`text-left p-4 rounded-2xl border-2 transition ${identityMode === 'anonymous' ? 'border-ink-900 bg-paper-100' : 'border-line hover:border-ink-200'}`}
                                            >
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class={`w-2 h-2 rounded-full ${identityMode === 'anonymous' ? 'bg-ink-900' : 'bg-ink-200'}`}></span>
                                                    <span class="font-semibold text-sm">ไม่ระบุตัวตน</span>
                                                </div>
                                                <p class="text-xs text-ink-500">คู่สนทนาจะเห็นเพียงชื่อสมมติทั่วไป</p>
                                            </button>
                                            <button
                                                onClick={() => setIdentityMode('revealed')}
                                                class={`text-left p-4 rounded-2xl border-2 transition ${identityMode === 'revealed' ? 'border-primary-500 bg-primary-50/30' : 'border-line hover:border-ink-200'}`}
                                            >
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class={`w-2 h-2 rounded-full ${identityMode === 'revealed' ? 'bg-primary-500' : 'bg-ink-200'}`}></span>
                                                    <span class="font-semibold text-sm">ระบุตัวตน</span>
                                                </div>
                                                <p class="text-xs text-ink-500">คู่สนทนาเห็นชื่อจริงและชื่อสถานศึกษา</p>
                                            </button>
                                        </div>
                                    </div>

                                    {/* 3. อยากให้ช่วยแบบไหน (#2) */}
                                    <div class="border-t border-line pt-6">
                                        <div class="flex items-center justify-between mb-3">
                                            <h3 class="font-bold text-base text-ink-900 flex items-center gap-2.5">
                                                <span class="w-6 h-6 rounded-full bg-primary-500 text-white text-xs font-bold flex items-center justify-center shrink-0">3</span>
                                                อยากให้ช่วยแบบไหน
                                            </h3>
                                            <span class="text-xs text-primary-600 font-medium hidden sm:inline">จับคู่คนที่ต้องการแบบเดียวกันก่อน</span>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            {SUPPORT_TYPES.map(s => (
                                                <button key={s.id} onClick={() => setSelectedSupport(s.id)}
                                                    class={`text-left p-4 rounded-2xl border-2 transition ${selectedSupport === s.id ? 'border-primary-500 bg-primary-50/30' : 'border-line hover:border-ink-200'}`}>
                                                    <div class="font-semibold text-sm text-ink-900 mb-0.5">{s.emoji} {s.label}</div>
                                                    <div class="text-xs text-ink-500">{s.desc}</div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Role Cards Area */}
                            <div class="flex items-end justify-between mb-6">
                                <h2 class="text-2xl font-extrabold flex items-center gap-2.5">
                                    {!isAdmin && <span class="w-6 h-6 rounded-full bg-primary-500 text-white text-xs font-bold flex items-center justify-center shrink-0">4</span>}
                                    {isAdmin ? 'ระบบจัดการหลังบ้าน' : 'เริ่มต้นจับคู่พูดคุยได้เลย'}
                                </h2>
                            </div>

                            <div class="relative">
                                <div class="blob w-72 h-72 bg-primary-300 opacity-20 -top-10 -left-16"></div>
                                <div class="blob w-64 h-64 bg-secondary-300 opacity-20 -bottom-10 right-10" style={{ animationDelay: '3s' }}></div>
                                <div class="relative flex gap-5 overflow-x-auto scroll-row pb-4 -mx-6 px-6 sm:mx-0 sm:px-0">
                                    {isAdmin ? (
                                        <a href="admin.html" class="role-card card-playful shrink-0 w-80 bg-surface overflow-hidden">
                                            <div class="h-48 bg-gradient-to-br from-ink-900 to-primary-700 flex items-end p-5 relative overflow-hidden">
                                                <h3 class="text-white text-2xl font-extrabold">ไปหน้าจัดการระบบ</h3>
                                            </div>
                                            <div class="p-5">
                                                <p class="text-sm text-ink-500">ดูคิว ห้องแชท รายงานปัญหา และตั้งค่าธีม</p>
                                            </div>
                                        </a>
                                    ) : (
                                        <>
                                            <button onClick={() => startWithRole('venter')} disabled={starting}
                                                class="role-card card-playful shrink-0 w-85 text-left bg-surface overflow-hidden disabled:opacity-50">
                                                <div class="h-44 bg-gradient-to-br from-primary-400 to-primary-600 flex items-end p-5 relative overflow-hidden">
                                                    <div class="absolute inset-0 bg-cover" style={{ backgroundImage: "url('assets/card-venter.jpg')", backgroundPosition: 'center 60%' }}></div>
                                                    <div class="absolute inset-0" style={{ background: 'linear-gradient(to top, var(--color-primary-700) 0%, color-mix(in srgb, var(--color-primary-600) 50%, transparent) 42%, transparent 80%)' }}></div>
                                                    <h3 class="relative text-white text-2xl font-extrabold wiggle-hover" style={{ textShadow: '0 1px 8px rgba(0,0,0,.45)' }}>ฉันอยากระบาย 😔</h3>
                                                </div>
                                                <div class="p-5 flex items-center justify-between">
                                                    <p class="text-sm text-ink-500">อึดอัด มีเรื่องในใจ หาคนช่วยรับฟังทางนี้</p>
                                                    <svg class="w-5 h-5 text-primary-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                                                </div>
                                            </button>

                                            <button onClick={() => startWithRole('listener')} disabled={starting}
                                                class="role-card card-playful shrink-0 w-85 text-left bg-surface overflow-hidden disabled:opacity-50">
                                                <div class="h-44 bg-gradient-to-br from-secondary-400 to-secondary-600 flex items-end p-5 relative overflow-hidden">
                                                    <div class="absolute inset-0 bg-cover" style={{ backgroundImage: "url('assets/card-listener.jpg')", backgroundPosition: 'center 38%' }}></div>
                                                    <div class="absolute inset-0" style={{ background: 'linear-gradient(to top, var(--color-secondary-600) 0%, color-mix(in srgb, var(--color-secondary-500) 50%, transparent) 42%, transparent 80%)' }}></div>
                                                    <h3 class="relative text-white text-2xl font-extrabold wiggle-hover" style={{ textShadow: '0 1px 8px rgba(0,0,0,.45)' }}>ฉันอยากรับฟัง 😊</h3>
                                                </div>
                                                <div class="p-5 flex items-center justify-between">
                                                    <p class="text-sm text-ink-500">พร้อมเปิดใจ มอบพลังบวกและรับฟังคนอื่น</p>
                                                    <svg class="w-5 h-5 text-secondary-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                                                </div>
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>

                            {/* วงกลมแบ่งปัน — ห้องกลุ่ม (#6) */}
                            {!isAdmin && (
                                <button onClick={joinGroupRoom} disabled={starting}
                                    class="mt-6 w-full card-playful bg-surface overflow-hidden text-left disabled:opacity-50 group">
                                    <div class="flex items-center gap-4 p-5 sm:p-6">
                                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-400 to-secondary-500 flex items-center justify-center text-3xl shrink-0 group-hover:scale-105 transition">👥</div>
                                        <div class="min-w-0 flex-1">
                                            <div class="font-extrabold text-lg text-ink-900">เข้าวงกลมแบ่งปัน</div>
                                            <div class="text-sm text-ink-500">คุยกันเป็นกลุ่มเล็ก 3-4 คนในหัวข้อ <span class="text-primary-600 font-medium">{TOPICS.find(t => t.id === selectedTopic)?.label || 'เรื่องทั่วไป'}</span> · ไม่ระบุตัวตน</div>
                                        </div>
                                        <svg class="w-5 h-5 text-primary-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                                    </div>
                                </button>
                            )}
                            {!isAdmin && <ScheduledCircle onJoin={joinScheduledCircle} starting={starting} />}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer class="bg-paper-50 border-t border-line py-8 px-6 text-center">
                        <p class="text-sm text-ink-300">© 2026 NOMGI · พื้นที่แบ่งปันน้ำใจสร้างด้วยความห่วงใย</p>
                    </footer>

                    {/* Mood check-in ก่อนเข้าคิว (#4) */}
                    {moodRole && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setMoodRole(null)}></div>
                            <div class="relative bg-surface rounded-3xl p-7 max-w-sm w-full shadow-float text-center border border-line">
                                <div class="text-3xl mb-2">🌤️</div>
                                <h3 class="text-lg font-bold text-ink-900 mb-1">ตอนนี้รู้สึกยังไงบ้าง?</h3>
                                <p class="text-xs text-ink-400 mb-5">บันทึกส่วนตัวก่อนเริ่มคุย เห็นแค่คุณคนเดียว — ไว้ดูว่าการได้ระบายช่วยไหม</p>
                                <div class="flex justify-between gap-1 mb-4">
                                    {(window.NomGIMood?.MOODS || []).map(m => (
                                        <button key={m.score} type="button" onClick={() => proceedToQueue(moodRole, m.score)}
                                            class="flex-1 flex flex-col items-center gap-1 py-2 rounded-2xl hover:bg-paper-100 transition active:scale-90">
                                            <span class="text-3xl">{m.emoji}</span>
                                            <span class="text-[10px] text-ink-400">{m.label}</span>
                                        </button>
                                    ))}
                                </div>
                                <button type="button" onClick={() => proceedToQueue(moodRole, null)} class="text-xs text-ink-400 hover:text-primary-600 transition">
                                    ข้าม เริ่มคุยเลย →
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
