<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน | NomGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                    colors: {
                        paper: {
                            50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)',
                            200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)'
                        },
                        ink: {
                            900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)',
                            400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)'
                        },
                        surface: 'var(--color-surface)',
                        primary: {
                            50: 'var(--color-primary-50)', 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)'
                        },
                        line: 'var(--color-line)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-500: #4D7355; --color-primary-600: #3d5d44;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #9c9c9c; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
        body { font-family: 'Kanit', sans-serif; background-color: var(--color-paper-50); transition: background-color 0.3s ease; }
        @keyframes blobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -25px) scale(1.05); } 66% { transform: translate(-15px, 15px) scale(0.96); } }
        .blob { position: absolute; border-radius: 50%; filter: blur(40px); animation: blobFloat 12s ease-in-out infinite; pointer-events: none; }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        .wiggle-hover:hover { animation: wiggle 0.4s ease-in-out; }
        .btn-playful { border-radius: 9999px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-600)); box-shadow: 0 8px 20px -6px var(--color-primary-500); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-playful:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 26px -6px var(--color-primary-500); }
        .btn-playful:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .card-playful { border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -16px rgba(51,73,47,.28); border: 1px solid var(--color-line); }
        .avatar-ring { background: linear-gradient(135deg, var(--color-primary-500), var(--color-secondary-500, var(--color-primary-600))); padding: 4px; }
        /* การ์ดที่อยู่ในหมวดพับได้ — ตัด chrome ของการ์ดออก กันการ์ดซ้อนการ์ด */
        .section-fold .card-playful { border: 0; box-shadow: none; background: transparent; border-radius: 0; padding: 0.25rem 0 0; }
    </style>
    <script src="theme.js"></script>
    <script src="icons.js"></script>
    <script src="illustrations.js"></script>
    <script src="pwa.js"></script>
    <script src="panic.js"></script>
    <script src="kudos-tree.js"></script>
    <script src="mood.js"></script>
</head>
<body class="min-h-screen text-ink-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const supabase = window.supabaseClient;
        function Icon({ n, s = 20, cls = '' }) {
            return <span class={`inline-flex items-center justify-center align-middle ${cls}`}
                dangerouslySetInnerHTML={{ __html: (window.NomGIcon ? NomGIcon(n, s) : '') }} />;
        }

        const SPECIALTY_OPTIONS = [
            { id: 'general', label: 'เรื่องทั่วไป 💬' },
            { id: 'study', label: 'การเรียน 📚' },
            { id: 'love', label: 'ความรัก ❤️' },
            { id: 'work', label: 'การทำงาน 💼' },
            { id: 'family', label: 'ครอบครัว 🏠' },
            { id: 'health', label: 'สุขภาพจิต 🧠' },
        ];
        const SPECIALTY_LABEL = Object.fromEntries(SPECIALTY_OPTIONS.map(s => [s.id, s.label]));

        const kudosPlantSvg = (window.NomGIKudos && window.NomGIKudos.plantSvg) || (() => '');
        const kudosStage = (window.NomGIKudos && window.NomGIKudos.stage) || (() => ({ level: 0, label: '' }));
        const kudosBadge = (window.NomGIKudos && window.NomGIKudos.badge) || (() => ({ current: { icon: '', name: '' }, next: null, remaining: 0 }));
        const healingTreeSvg = (window.NomGIKudos && window.NomGIKudos.growthSvg) || (() => '');
        const healingGrowth = (window.NomGIKudos && window.NomGIKudos.growth) || (() => ({ level: 0, label: '', min: 0, next: null, remaining: 0 }));
        const NomGIMood = window.NomGIMood || { history: () => [], stats: () => ({ total: 0, improvedPct: 0 }), moodOf: () => ({ emoji: '', color: '#ccc' }), streak: () => 0, sessionCount: () => 0 };

        // การ์ด "ต้นไม้น้ำใจ" — โชว์ kudos ของเราเป็นต้นไม้ที่โต + ตราน้ำใจ (#9)
        function KudosTreeCard({ count, ratingAvg, ratingCount, trainedAt }) {
            const s = kudosStage(count || 0);
            const b = kudosBadge(count || 0);
            const trusted = (ratingCount || 0) >= 3 && Number(ratingAvg || 0) >= 4.3;
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="flex items-center gap-5">
                        <div class="shrink-0 w-28 h-28" dangerouslySetInnerHTML={{ __html: kudosPlantSvg(count || 0, 112) }}></div>
                        <div class="min-w-0">
                            <div class="text-xs font-semibold uppercase tracking-wide text-primary-600">ต้นไม้น้ำใจของฉัน</div>
                            <div class="text-2xl font-extrabold text-ink-900 mt-1">{s.label}</div>
                            <div class="text-sm text-ink-500 mt-0.5">ได้รับน้ำใจมาแล้ว {count || 0} ครั้ง</div>
                            <div class="flex flex-wrap items-center gap-1.5 mt-2">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-50 text-primary-700 text-xs font-semibold">
                                    <span class="text-base">{b.current.icon}</span> {b.current.name}
                                </span>
                                {trainedAt && (
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-primary-50 text-primary-700 text-xs font-semibold border border-primary-200">
                                        ✅ ผ่านการอบรม
                                    </span>
                                )}
                                {trusted && (
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold border border-amber-200">
                                        🌟 ผู้ฟังที่ไว้ใจได้ · {Number(ratingAvg).toFixed(1)}
                                    </span>
                                )}
                            </div>
                        </div>
                    </div>
                    {b.next && (
                        <div class="mt-4 pt-4 border-t border-line">
                            <div class="flex items-center justify-between text-xs text-ink-500 mb-1.5">
                                <span>ตราถัดไป: {b.next.icon} {b.next.name}</span>
                                <span>อีก {b.remaining} น้ำใจ</span>
                            </div>
                            <div class="h-2 bg-paper-100 rounded-full overflow-hidden">
                                <div class="h-full bg-primary-500 rounded-full transition-all" style={{ width: Math.min(100, Math.round(((count||0) - b.current.min) / Math.max(1, b.next.min - b.current.min) * 100)) + '%' }}></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // การ์ด "ต้นไม้แห่งการเยียวยา" — โตทุกครั้งที่ระบาย/พูดคุยจบ (ส่วนตัว เก็บใน localStorage)
        function HealingTreeCard() {
            const sessions = NomGIMood.sessionCount();
            const g = healingGrowth(sessions);
            const nextMin = g.next;
            const pct = nextMin ? Math.min(100, Math.round((sessions - g.min) / Math.max(1, nextMin - g.min) * 100)) : 100;
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="flex items-center gap-5">
                        <div class="shrink-0 w-28 h-28" dangerouslySetInnerHTML={{ __html: healingTreeSvg(sessions, 112) }}></div>
                        <div class="min-w-0">
                            <div class="text-xs font-semibold uppercase tracking-wide text-primary-600">ต้นไม้แห่งการเยียวยา</div>
                            <div class="text-2xl font-extrabold text-ink-900 mt-1">{g.label}</div>
                            <div class="text-sm text-ink-500 mt-0.5">
                                {sessions > 0 ? `เปิดใจระบายมาแล้ว ${sessions} ครั้ง` : 'ทุกครั้งที่คุณเปิดใจ ต้นไม้จะค่อยๆ โต 🌱'}
                            </div>
                        </div>
                    </div>
                    {nextMin && (
                        <div class="mt-4 pt-4 border-t border-line">
                            <div class="flex items-center justify-between text-xs text-ink-500 mb-1.5">
                                <span>ต้นไม้จะโตอีกขั้น</span>
                                <span>อีก {g.remaining} ครั้ง</span>
                            </div>
                            <div class="h-2 bg-paper-100 rounded-full overflow-hidden">
                                <div class="h-full bg-primary-500 rounded-full transition-all" style={{ width: pct + '%' }}></div>
                            </div>
                        </div>
                    )}
                    <p class="text-[11px] text-ink-400 mt-3">ต้นไม้นี้เป็นของคุณคนเดียว · เก็บไว้ในเครื่องนี้ ไม่มีใครเห็น</p>
                </div>
            );
        }

        // การ์ด "เส้นทางใจของฉัน" — กราฟ mood ก่อน/หลังคุย (ส่วนตัว จาก localStorage)
        function MoodJourneyCard() {
            const history = NomGIMood.history().filter(e => e.after != null);
            const stats = NomGIMood.stats();
            if (!history.length) {
                return (
                    <div class="card-playful bg-surface p-6">
                        <div class="text-xs font-semibold uppercase tracking-wide text-primary-600 mb-1">เส้นทางใจของฉัน</div>
                        <div class="w-40 max-w-[60%] mx-auto my-2" dangerouslySetInnerHTML={{ __html: (window.NomGIllus ? NomGIllus('empty-generic') : '') }}></div>
                        <p class="text-sm text-ink-400 mt-1 text-center">ยังไม่มีบันทึกความรู้สึก — หลังคุยจบครั้งถัดไป ลองบอกความรู้สึกดูนะ แล้วกราฟจะค่อยๆ ปรากฏที่นี่ (เห็นแค่คุณคนเดียว)</p>
                    </div>
                );
            }
            const recent = history.slice(-14);
            const W = 300, H = 90, pad = 6;
            const stepX = recent.length > 1 ? (W - pad * 2) / (recent.length - 1) : 0;
            const y = v => H - pad - ((v - 1) / 4) * (H - pad * 2);
            const pts = recent.map((e, i) => [pad + i * stepX, y(e.after)]);
            const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-xs font-semibold uppercase tracking-wide text-primary-600">เส้นทางใจของฉัน</div>
                        <div class="flex items-center gap-2">
                            {NomGIMood.streak() > 0 && <span class="text-xs font-semibold text-primary-600">🔥 {NomGIMood.streak()} วันติด</span>}
                            <span class="text-xs text-ink-400">ส่วนตัว · {stats.total} ครั้ง</span>
                        </div>
                    </div>
                    {stats.total > 0 && (
                        <p class="text-sm text-ink-700 mb-3">
                            หลังได้ระบาย/รับฟัง <span class="font-bold text-primary-600">รู้สึกดีขึ้น {stats.improvedPct}%</span> ของครั้งที่บันทึก 🌤️
                        </p>
                    )}
                    <svg viewBox={`0 0 ${W} ${H}`} class="w-full" style={{ height: '90px' }}>
                        <line x1={pad} y1={y(3)} x2={W-pad} y2={y(3)} stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
                        <path d={path} fill="none" stroke="var(--color-primary-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        {pts.map((p, i) => (
                            <circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill={NomGIMood.moodOf(recent[i].after).color}/>
                        ))}
                    </svg>
                    <div class="flex justify-between text-[10px] text-ink-300 mt-1"><span>เก่าสุด</span><span>ล่าสุด</span></div>
                </div>
            );
        }

        // สรุปสัปดาห์นี้
        function WeeklySummaryCard() {
            const w = (NomGIMood.weeklyStats && NomGIMood.weeklyStats()) || null;
            if (!w) return null;
            const items = [
                { label: 'เช็คอิน', value: w.checkins + '/7', icon: '📅' },
                { label: 'อารมณ์เฉลี่ย', value: w.checkins ? w.avgDaily.toFixed(1) + '/5' : '–', icon: '🌤️' },
                { label: 'คุยแล้วดีขึ้น', value: w.chatCount ? w.improvedChats + '/' + w.chatCount + ' ครั้ง' : '–', icon: '💬' },
                { label: 'ขอบคุณ', value: w.gratitudeCount + ' อย่าง', icon: '🌷' },
            ];
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-xs font-semibold uppercase tracking-wide text-primary-600">สัปดาห์นี้ของคุณ</div>
                        {w.streak > 0 && <span class="text-xs font-semibold text-primary-600">🔥 {w.streak} วันติด</span>}
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        {items.map((it, i) => (
                            <div key={i} class="bg-paper-50 rounded-2xl p-4">
                                <div class="text-2xl mb-1">{it.icon}</div>
                                <div class="text-lg font-extrabold text-ink-900">{it.value}</div>
                                <div class="text-xs text-ink-500">{it.label}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // สมุดขอบคุณย้อนหลัง
        function GratitudeListCard() {
            const list = ((NomGIMood.gratitudeList && NomGIMood.gratitudeList()) || []).slice(-8).reverse();
            if (!list.length) return null;
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="text-xs font-semibold uppercase tracking-wide text-primary-600 mb-3">สมุดขอบคุณ 🌷</div>
                    <div class="space-y-2">
                        {list.map((g, i) => (
                            <div key={i} class="flex items-start gap-2 text-sm">
                                <span class="text-ink-300 shrink-0">•</span>
                                <span class="text-ink-700">{g.text}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // โหมดช่วยการเข้าถึง (ขนาดฟอนต์ + ลดการเคลื่อนไหว)
        function AccessibilityCard() {
            const T = window.BlissiamTheme || {};
            const [scale, setScaleState] = useState(() => (T.getFontScale ? T.getFontScale() : 1));
            const [rm, setRm] = useState(() => (T.getReduceMotion ? T.getReduceMotion() : false));
            if (!T.setFontScale) return null;
            const scales = [{ v: 0.9, label: 'เล็ก' }, { v: 1, label: 'ปกติ' }, { v: 1.15, label: 'ใหญ่' }, { v: 1.3, label: 'ใหญ่มาก' }];
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="text-xs font-semibold uppercase tracking-wide text-primary-600 mb-3">การช่วยการเข้าถึง</div>
                    <div class="mb-4">
                        <div class="text-sm text-ink-700 mb-2">ขนาดตัวอักษร</div>
                        <div class="grid grid-cols-4 gap-2">
                            {scales.map(s => (
                                <button key={s.v} type="button" onClick={() => { T.setFontScale(s.v); setScaleState(s.v); }}
                                    class={`py-2 rounded-xl border text-sm transition ${scale === s.v ? 'border-primary-500 bg-primary-50 text-primary-600 font-semibold' : 'border-line text-ink-500 hover:border-ink-300'}`}>
                                    {s.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm text-ink-700">ลดการเคลื่อนไหว (สำหรับคนที่ไวต่ออนิเมชัน)</span>
                        <button type="button" onClick={() => { const n = !rm; T.setReduceMotion(n); setRm(n); }}
                            class={`w-12 h-7 rounded-full transition relative ${rm ? 'bg-primary-500' : 'bg-paper-200'}`}>
                            <span class={`absolute top-1 w-5 h-5 bg-white rounded-full shadow transition-all ${rm ? 'left-6' : 'left-1'}`}></span>
                        </button>
                    </label>
                </div>
            );
        }

        // แผนรับมือของฉัน (Safety Plan) — ส่วนตัวใน localStorage เท่านั้น
        const SAFETY_KEY = 'nomgi_safety_plan';
        const SAFETY_FIELDS = [
            { k: 'signs',   label: 'สัญญาณเตือนของฉัน',            ph: 'เช่น นอนไม่หลับ เก็บตัว คิดวนซ้ำๆ...' },
            { k: 'helps',   label: 'สิ่งที่ช่วยให้ดีขึ้น',          ph: 'เช่น ฟังเพลง เดินเล่น หายใจลึกๆ อาบน้ำอุ่น...' },
            { k: 'people',  label: 'คนที่ทักหา/โทรหาได้',           ph: 'เช่น เพื่อนสนิท พี่ ครูที่ไว้ใจ...' },
            { k: 'reasons', label: 'เหตุผลที่อยากผ่านมันไปให้ได้',   ph: 'สิ่งที่ยึดเหนี่ยว คนหรือความฝันที่รออยู่...' },
        ];
        function SafetyPlanCard() {
            const [open, setOpen] = useState(false);
            const [data, setData] = useState(() => { try { return JSON.parse(localStorage.getItem(SAFETY_KEY)) || {}; } catch (e) { return {}; } });
            const [saved, setSaved] = useState(false);
            const hasAny = SAFETY_FIELDS.some(f => (data[f.k] || '').trim());
            function set(k, v) { setData(d => ({ ...d, [k]: v })); setSaved(false); }
            function save() { try { localStorage.setItem(SAFETY_KEY, JSON.stringify(data)); } catch (e) {} setSaved(true); }
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="flex items-center justify-between mb-1">
                        <div class="text-xs font-semibold uppercase tracking-wide text-primary-600">แผนรับมือของฉัน 🛟</div>
                        {(hasAny || open) && (
                            <button type="button" onClick={() => setOpen(o => !o)} class="text-xs text-ink-400 hover:text-primary-600 transition">{open ? 'เสร็จ' : 'แก้ไข'}</button>
                        )}
                    </div>
                    <p class="text-xs text-ink-400 mb-4">การ์ดส่วนตัวไว้เปิดดูตอนใจไม่ดี · เก็บในเครื่องนี้เท่านั้น ไม่ส่งขึ้นเซิร์ฟเวอร์</p>
                    {open ? (
                        <div class="space-y-3">
                            {SAFETY_FIELDS.map(f => (
                                <div key={f.k}>
                                    <label class="text-sm text-ink-700 font-medium">{f.label}</label>
                                    <textarea value={data[f.k] || ''} onChange={e => set(f.k, e.target.value.slice(0, 600))} rows="2" placeholder={f.ph}
                                        class="mt-1 w-full bg-paper-50 border border-line rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-primary-500/30" />
                                </div>
                            ))}
                            <div class="flex items-center gap-3 pt-1">
                                <button type="button" onClick={save} class="px-4 py-2 rounded-full bg-primary-500 text-white text-sm font-semibold hover:bg-primary-600 transition">บันทึก</button>
                                {saved && <span class="text-xs text-primary-600">บันทึกแล้ว ✓</span>}
                            </div>
                            <div class="mt-2 pt-3 border-t border-line text-xs text-ink-500 space-y-1">
                                <div class="font-semibold text-ink-600">สายด่วนช่วยเหลือ (24 ชม.)</div>
                                <div>· สายด่วนสุขภาพจิต <b>1323</b></div>
                                <div>· สมาคมสะมาริตันส์ <b>02-113-6789</b></div>
                                <div>· เจ็บป่วยฉุกเฉิน <b>1669</b></div>
                            </div>
                        </div>
                    ) : hasAny ? (
                        <div class="space-y-3">
                            {SAFETY_FIELDS.filter(f => (data[f.k] || '').trim()).map(f => (
                                <div key={f.k}>
                                    <div class="text-xs text-ink-400">{f.label}</div>
                                    <div class="text-sm text-ink-700 whitespace-pre-wrap">{data[f.k]}</div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <button type="button" onClick={() => setOpen(true)} class="text-sm text-primary-600 hover:underline">+ เขียนแผนรับมือของฉัน</button>
                    )}
                </div>
            );
        }

        // ข้อมูลของฉัน — ส่งออก / ลบ (ข้อมูลส่วนตัวใน localStorage)
        function DataCard() {
            const [msg, setMsg] = useState(null);
            function collect() {
                const o = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.indexOf('nomgi_') === 0) {
                        try { o[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { o[k] = localStorage.getItem(k); }
                    }
                }
                return o;
            }
            function exportData() {
                const payload = { app: 'NomGI', exportedAt: new Date().toISOString(), data: collect() };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'nomgi-my-data-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
                setMsg('ดาวน์โหลดข้อมูลแล้ว ✓');
            }
            function wipe() {
                if (!confirm('ลบข้อมูลส่วนตัวในเครื่องนี้ทั้งหมด?\n(บันทึกอารมณ์ · สมุดขอบคุณ · แผนรับมือ)\nกู้คืนไม่ได้')) return;
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.indexOf('nomgi_') === 0) keys.push(k);
                }
                keys.forEach(k => localStorage.removeItem(k));
                setMsg('ลบข้อมูลส่วนตัวแล้ว · กำลังรีเฟรช...');
                setTimeout(() => location.reload(), 900);
            }
            return (
                <div class="card-playful bg-surface p-6">
                    <div class="text-xs font-semibold uppercase tracking-wide text-primary-600 mb-1">ข้อมูลของฉัน 🔒</div>
                    <p class="text-xs text-ink-400 mb-4">บันทึกอารมณ์ สมุดขอบคุณ และแผนรับมือ เก็บไว้ในเครื่องนี้เท่านั้น เป็นของคุณคนเดียว</p>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <button type="button" onClick={exportData} class="flex-1 px-4 py-2.5 rounded-xl border border-line text-sm font-semibold text-ink-700 hover:border-primary-400 hover:text-primary-600 transition">⬇ ส่งออกข้อมูล (.json)</button>
                        <button type="button" onClick={wipe} class="flex-1 px-4 py-2.5 rounded-xl border border-red-200 text-sm font-semibold text-red-600 hover:bg-red-50 transition">🗑 ลบข้อมูลส่วนตัว</button>
                    </div>
                    {msg && <div class="text-xs text-primary-600 mt-3">{msg}</div>}
                </div>
            );
        }

        // หมวดพับได้ — ใช้ <details> ได้คีย์บอร์ด/สกรีนรีดเดอร์ฟรี ลดความยาวหน้าบนมือถือ
        function Section({ icon, title, hint, children, defaultOpen = false }) {
            return (
                <details open={defaultOpen} class="section-fold group rounded-2xl border border-line bg-surface overflow-hidden">
                    <summary class="flex items-center gap-3 px-5 py-4 cursor-pointer select-none list-none [&::-webkit-details-marker]:hidden hover:bg-paper-50 transition">
                        <span class="text-xl leading-none">{icon}</span>
                        <span class="flex-1 min-w-0">
                            <span class="block font-bold text-sm text-ink-900">{title}</span>
                            {hint && <span class="block text-xs text-ink-500 mt-0.5">{hint}</span>}
                        </span>
                        <svg class="w-4 h-4 text-ink-400 transition-transform group-open:rotate-180 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="px-5 pb-5 pt-1 space-y-4 border-t border-line/60">{children}</div>
                </details>
            );
        }

        function DarkModeToggle({ isDark, onToggle }) {
            return (
                <button type="button" onClick={onToggle} title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    class="w-9 h-9 rounded-full flex items-center justify-center border border-line bg-surface hover:border-primary-400 transition text-ink-700 hover:text-primary-600">
                    {isDark ? (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    ) : (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    )}
                </button>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [uploadingAvatar, setUploadingAvatar] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            function toggleDarkMode() {
                const resolved = window.BlissiamTheme?.toggleColorScheme();
                setIsDark(resolved === 'dark');
            }

            const [displayName, setDisplayName] = useState('');
            const [realName, setRealName] = useState('');
            const [school, setSchool] = useState('');
            const [email, setEmail] = useState('');
            const [igUsername, setIgUsername] = useState('');
            const [avatarUrl, setAvatarUrl] = useState('');
            const [kudosCount, setKudosCount] = useState(0);
            const [specialties, setSpecialties] = useState([]);
            const [ratingAvg, setRatingAvg] = useState(null);
            const [ratingCount, setRatingCount] = useState(0);
            const [trainedAt, setTrainedAt] = useState(null);

            const fileInputRef = useRef(null);

            useEffect(() => {
                window.BlissiamTheme?.loadAndApplyTheme();
                init();
            }, []);

            async function init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html?redirect=profile.html'; return; }
                setUser(session.user);
                setEmail(session.user.email || '');

                const { data: profileData } = await supabase
                    .from('profiles').select('*').eq('id', session.user.id).single();

                if (profileData) {
                    setDisplayName(profileData.display_name || '');
                    setRealName(profileData.real_name || '');
                    setSchool(profileData.school || '');
                    setIgUsername(profileData.ig_username || '');
                    setAvatarUrl(profileData.avatar_url || '');
                    setKudosCount(profileData.kudos_count || 0);
                    setSpecialties(Array.isArray(profileData.specialties) ? profileData.specialties : []);
                    setRatingAvg(profileData.rating_avg != null ? profileData.rating_avg : null);
                    setRatingCount(profileData.rating_count || 0);
                    setTrainedAt(profileData.trained_at || null);
                }
                setLoading(false);
            }

            async function handleAvatarUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                setUploadingAvatar(true);
                setError(null);
                
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${user.id}-${Math.random()}.${fileExt}`;
                    
                    const { error: uploadError } = await supabase.storage.from('avatars').upload(fileName, file);
                    if (uploadError) throw uploadError;
                    
                    const { data } = supabase.storage.from('avatars').getPublicUrl(fileName);
                    setAvatarUrl(data.publicUrl);
                } catch(err) {
                    setError('อัปโหลดรูปไม่สำเร็จ: ' + err.message);
                }
                setUploadingAvatar(false);
            }

            async function handleSave(e) {
                e.preventDefault();
                setError(null); setSuccess(null);
                setSaving(true);
                
                try {
                    const cleanIg = igUsername.replace('@', '').trim(); // ลบ @ เผื่อผู้ใช้พิมพ์มา
                    const { error: updateError } = await supabase.from('profiles').update({
                        display_name: displayName.trim(),
                        real_name: realName.trim(),
                        school: school.trim(),
                        ig_username: cleanIg,
                        avatar_url: avatarUrl,
                        specialties: specialties
                    }).eq('id', user.id);

                    if (updateError) throw updateError;
                    setSuccess('บันทึกข้อมูลเรียบร้อยแล้ว');
                } catch (err) {
                    setError(err.message);
                } finally {
                    setSaving(false);
                }
            }

            if (loading) return <div class="min-h-screen flex items-center justify-center bg-paper-50">กำลังโหลด...</div>;

            return (
                <div class="min-h-screen bg-paper-50 relative overflow-hidden">
                    <div class="blob w-72 h-72 bg-primary-300 opacity-20 -top-10 -left-16"></div>
                    <div class="blob w-64 h-64 bg-secondary-300 opacity-20 top-40 -right-10" style={{ animationDelay: '2s' }}></div>
                    <nav class="sticky top-0 w-full z-50 bg-surface border-b border-line px-6 py-4">
                        <div class="max-w-2xl mx-auto flex justify-between items-center">
                            <h1 class="text-xl font-extrabold tracking-tight">โปรไฟล์ของฉัน ✨</h1>
                            <div class="flex items-center gap-4">
                                <DarkModeToggle isDark={isDark} onToggle={toggleDarkMode} />
                                <a href="index.html" class="text-sm text-ink-700 hover:text-primary-600 font-medium inline-flex items-center gap-1"><Icon n="arrow-left" s={15} /> กลับหน้าแรก</a>
                            </div>
                        </div>
                    </nav>

                    <div class="max-w-2xl mx-auto px-6 py-10 relative z-10 space-y-6">
                        {error && <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm">{error}</div>}
                        {success && <div class="bg-primary-50 text-primary-700 px-4 py-3 rounded-xl text-sm">{success}</div>}

                        {/* ต้นไม้แห่งการเยียวยา (โตทุกครั้งที่ระบายจบ) + ต้นไม้น้ำใจ (#5) */}
                        <HealingTreeCard />
                        <KudosTreeCard count={kudosCount} ratingAvg={ratingAvg} ratingCount={ratingCount} trainedAt={trainedAt} />

                        {/* หมวดพับได้ — ลดความยาวหน้า ให้ฟอร์มโปรไฟล์เข้าถึงง่ายขึ้น */}
                        <Section icon="📊" title="สัปดาห์นี้ของฉัน" hint="สรุปสัปดาห์ · เส้นทางใจ · สมุดขอบคุณ (ส่วนตัว เห็นแค่คุณ)">
                            <WeeklySummaryCard />
                            <MoodJourneyCard />
                            <GratitudeListCard />
                        </Section>

                        <SafetyPlanCard />

                        <Section icon="⚙️" title="การตั้งค่าและข้อมูลของฉัน" hint="การช่วยการเข้าถึง · ส่งออก/ลบข้อมูล">
                            <AccessibilityCard />
                            <DataCard />
                        </Section>

                        <form onSubmit={handleSave} class="card-playful bg-surface p-8 space-y-6">
                            {/* ส่วนอัปโหลดรูป */}
                            <div class="flex flex-col items-center pb-6 border-b border-line">
                                <div class="avatar-ring rounded-full mb-3">
                                <div
                                    class="w-28 h-28 rounded-full bg-cover bg-center flex items-center justify-center text-4xl font-bold text-ink-300 relative cursor-pointer group"
                                    style={avatarUrl ? {backgroundImage: `url(${avatarUrl})`} : {backgroundColor: 'var(--color-paper-100)'}}
                                    onClick={() => fileInputRef.current.click()}
                                >
                                    {!avatarUrl && displayName.charAt(0)}
                                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                        <span class="text-white text-xs font-medium">เปลี่ยนรูป</span>
                                    </div>
                                </div>
                                </div>
                                <input type="file" ref={fileInputRef} onChange={handleAvatarUpload} accept="image/*" class="hidden" />
                                <div class="text-sm text-ink-500 font-medium">
                                    {uploadingAvatar ? 'กำลังอัปโหลด...' : 'แตะที่รูปเพื่อเปลี่ยนรูปโปรไฟล์'}
                                </div>
                            </div>

                            {/* โซเชียลมีเดีย */}
                            <div class="space-y-4">
                                <div class="text-xs font-semibold uppercase tracking-wide text-pink-600 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                                    Instagram
                                </div>
                                <div>
                                    <input type="text" value={igUsername} onChange={e => setIgUsername(e.target.value)} placeholder="username (ไม่บังคับ)" class="w-full bg-paper-50 border border-line rounded-2xl px-4 py-3 focus:ring-2 focus:ring-pink-500 transition" />
                                    <p class="text-xs text-ink-300 mt-1">คู่สนทนาจะเห็น IG ของคุณเมื่อกดดูโปรไฟล์ในแชท</p>
                                </div>
                            </div>

                            <div class="border-t border-line pt-5 space-y-4">
                                <div class="text-xs font-semibold uppercase tracking-wide text-ink-500">ข้อมูลพื้นฐาน</div>
                                <div>
                                    <label class="block text-sm text-ink-700 mb-1">ชื่อที่แสดงในแชท</label>
                                    <input type="text" value={displayName} onChange={e => setDisplayName(e.target.value)} required class="w-full bg-paper-50 border border-line rounded-2xl px-4 py-3 focus:ring-2 focus:ring-primary-500 transition" />
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm text-ink-700 mb-1">ชื่อจริง</label>
                                        <input type="text" value={realName} onChange={e => setRealName(e.target.value)} required class="w-full bg-paper-50 border border-line rounded-2xl px-4 py-3 focus:ring-2 focus:ring-primary-500 transition" />
                                    </div>
                                    <div>
                                        <label class="block text-sm text-ink-700 mb-1">โรงเรียน / มหาลัย</label>
                                        <input type="text" value={school} onChange={e => setSchool(e.target.value)} required class="w-full bg-paper-50 border border-line rounded-2xl px-4 py-3 focus:ring-2 focus:ring-primary-500 transition" />
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-line pt-5">
                                <div class="text-xs font-semibold uppercase tracking-wide text-ink-500 mb-1">ความถนัดในการรับฟัง</div>
                                <p class="text-xs text-ink-300 mb-3">เลือกเรื่องที่คุณถนัดรับฟัง — คู่สนทนาจะเห็นตอนคุยกัน เพื่อรู้ว่าคุยกับใครอยู่</p>
                                <div class="flex flex-wrap gap-2">
                                    {SPECIALTY_OPTIONS.map(s => {
                                        const on = specialties.includes(s.id);
                                        return (
                                            <button key={s.id} type="button"
                                                onClick={() => setSpecialties(on ? specialties.filter(x => x !== s.id) : [...specialties, s.id])}
                                                class={`px-3 py-1.5 rounded-full text-sm border transition ${on ? 'bg-primary-500 text-white border-primary-500' : 'bg-paper-50 text-ink-600 border-line hover:border-primary-300'}`}>
                                                {s.label}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <button type="submit" disabled={saving || uploadingAvatar} class="btn-playful w-full text-white py-3 font-semibold disabled:opacity-50">
                                {saving ? 'กำลังบันทึก...' : 'บันทึกการเปลี่ยนแปลง'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
