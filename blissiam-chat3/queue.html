<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังจับคู่... | NomGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                    colors: {
                        paper: {
                            50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)',
                            200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)'
                        },
                        ink: {
                            900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)',
                            400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)'
                        },
                        surface: 'var(--color-surface)',
                        primary: {
                            50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)', 400: 'var(--color-primary-400)', 500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)'
                        },
                        secondary: {
                            50: 'var(--color-secondary-50)', 100: 'var(--color-secondary-100)', 200: 'var(--color-secondary-200)',
                            300: 'var(--color-secondary-300)', 400: 'var(--color-secondary-400)', 500: 'var(--color-secondary-500)',
                            600: 'var(--color-secondary-600)'
                        },
                        line: 'var(--color-line)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-100: #e3ece0; --color-primary-200: #c5dcc0;
            --color-primary-300: #9dc295; --color-primary-400: #739e6b; --color-primary-500: #4D7355;
            --color-primary-600: #3d5d44; --color-primary-700: #314936;
            --color-secondary-50: #fbf3ea; --color-secondary-100: #f3e0c8; --color-secondary-200: #e6bf8e;
            --color-secondary-300: #cc9655; --color-secondary-400: #A8662A; --color-secondary-500: #925621; --color-secondary-600: #74441a;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #9c9c9c; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
    </style>
    <script src="theme.js"></script>
    <script src="icons.js"></script>
    <script src="pwa.js"></script>
    <script src="panic.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: var(--color-paper-50); background-image: radial-gradient(circle at 15% 10%, var(--color-primary-50) 0%, transparent 45%), radial-gradient(circle at 85% 90%, var(--color-secondary-50) 0%, transparent 45%); background-attachment: fixed; transition: background-color 0.3s ease; }
        .dot-pulse circle { animation: dotPulse 1.4s ease-in-out infinite; }
        .dot-pulse circle:nth-child(1) { animation-delay: 0s; }
        .dot-pulse circle:nth-child(2) { animation-delay: 0.1s; }
        .dot-pulse circle:nth-child(3) { animation-delay: 0.2s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .watermark { font-size: 9rem; font-weight: 800; color: var(--color-ink-900); opacity: 0.04; letter-spacing: -0.02em; white-space: nowrap; user-select: none; }
        .waiting-illustration {
            background-image: url('assets/waiting-illustration.png');
            background-size: cover;
            background-position: center 25%;
            background-attachment: fixed;
        }
        @media (max-width: 768px) {
            .waiting-illustration { background-attachment: scroll; }
        }
        .waiting-overlay {
            background: linear-gradient(180deg, var(--color-paper-50) 0%, color-mix(in srgb, var(--color-paper-50) 55%, transparent) 40%, color-mix(in srgb, var(--color-paper-50) 55%, transparent) 70%, var(--color-paper-50) 100%);
        }
        @keyframes blobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -25px) scale(1.05); } 66% { transform: translate(-15px, 15px) scale(0.96); } }
        .blob { position: absolute; border-radius: 50%; filter: blur(40px); animation: blobFloat 12s ease-in-out infinite; pointer-events: none; }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        .wiggle-hover:hover { animation: wiggle 0.4s ease-in-out; }
        .card-playful { border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -16px rgba(51,73,47,.28); border: 1px solid var(--color-line); }
    </style>
</head>
<body class="min-h-screen text-ink-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        function Icon({ n, s = 20, cls = '' }) {
            return <span class={`inline-flex items-center justify-center align-middle ${cls}`}
                dangerouslySetInnerHTML={{ __html: (window.NomGIcon ? NomGIcon(n, s) : '') }} />;
        }
        const supabase = window.supabaseClient;

        // ฟังก์ชันสร้างเสียงสังเคราะห์ (ปลอดภัยและเบราว์เซอร์ไม่บล็อกการทำงาน)
        function playMatchSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const audioCtx = new AudioContext();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // โน้ต C5
                gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.15);

                setTimeout(() => {
                    if(audioCtx.state === 'closed') return;
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime); // โน้ต G5
                    gain2.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.3);
                }, 150);
            } catch (e) {
                console.warn('เบราว์เซอร์บล็อกเสียงเริ่มต้น:', e);
            }
        }

        function DotLogo({ size = 28, animated = false }) {
            return (
                <svg width={size} height={size} viewBox="0 0 28 28" fill="none" class={animated ? 'dot-pulse' : ''}>
                    <circle cx="4" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="4" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="14" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="14" r="3" fill="var(--color-primary-500)"/><circle cx="24" cy="14" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="24" r="3" fill="var(--color-ink-900)"/>
                </svg>
            );
        }

        function DarkModeToggle({ isDark, onToggle }) {
            return (
                <button type="button" onClick={onToggle} title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    class="w-9 h-9 rounded-full flex items-center justify-center border border-line hover:border-primary-400 transition text-ink-700 hover:text-primary-600">
                    {isDark ? (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    ) : (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    )}
                </button>
            );
        }

        const ENCOURAGEMENT_QUOTES = [
            'ทุกความรู้สึกของคุณสำคัญเสมอ',
            'แค่คุณอยู่ตรงนี้ก็เก่งมากแล้ว',
            'ไม่เป็นไรถ้าวันนี้จะไม่โอเค พรุ่งนี้อาจจะดีขึ้น',
            'การขอความช่วยเหลือคือความกล้าหาญ ไม่ใช่ความอ่อนแอ',
            'หายใจลึกๆ อีกสักครู่จะมีคนมาคุยกับคุณ',
            'คุณไม่ได้อยู่คนเดียวในเรื่องนี้',
            'ทุกพายุมีวันสงบเสมอ',
            'ให้เวลากับตัวเองบ้าง คุณสมควรได้รับมัน',
            'แค่ผ่านวันนี้ไปได้ก็ถือว่าเก่งแล้ว',
            'ความรู้สึกของคุณมีความหมาย และเรื่องราวของคุณสำคัญ',
            'ไม่มีใครสมบูรณ์แบบ และนั่นก็โอเค',
            'บางครั้งการปล่อยให้น้ำตาไหลก็ช่วยให้ใจเบาลงได้',
            'คุณเข้มแข็งกว่าที่คุณคิดไว้มาก',
            'พักสักครู่ก็ไม่ได้แปลว่าล้มเหลว',
            'มีคนพร้อมรับฟังคุณอยู่เสมอ',
            'ทุกก้าวเล็กๆ ก็คือความก้าวหน้า',
        ];

        function WaitingCompanion({ waitTime }) {
            const [quoteIndex, setQuoteIndex] = useState(() => Math.floor(Math.random() * ENCOURAGEMENT_QUOTES.length));

            useEffect(() => {
                const interval = setInterval(() => {
                    setQuoteIndex(prev => {
                        if (ENCOURAGEMENT_QUOTES.length <= 1) return prev;
                        let next = Math.floor(Math.random() * ENCOURAGEMENT_QUOTES.length);
                        while (next === prev) next = Math.floor(Math.random() * ENCOURAGEMENT_QUOTES.length);
                        return next;
                    });
                }, 6000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div class="card-playful bg-surface overflow-hidden mt-4">
                    <div key={quoteIndex} class="p-5 text-center fade-in">
                        <p class="text-sm font-medium text-ink-700 leading-relaxed">"{ENCOURAGEMENT_QUOTES[quoteIndex]}"</p>
                    </div>
                </div>
            );
        }

        // แบบฝึกหายใจ 4-7-8 ระหว่างรอคิว (เข้า 4 · กลั้น 7 · ออก 8)
        const BREATH_PHASES = [
            { key: 'inhale', label: 'หายใจเข้า', secs: 4, scale: 1 },
            { key: 'hold',   label: 'กลั้นไว้',  secs: 7, scale: 1 },
            { key: 'exhale', label: 'หายใจออก', secs: 8, scale: 0.5 },
        ];
        function BreathingExercise({ onBack }) {
            const [idx, setIdx] = React.useState(0);
            const [count, setCount] = React.useState(4);
            React.useEffect(() => {
                let t1, t2;
                function run(k) {
                    setIdx(k);
                    const ph = BREATH_PHASES[k];
                    let c = ph.secs; setCount(c);
                    t2 = setInterval(() => { c--; setCount(c > 0 ? c : 0); }, 1000);
                    t1 = setTimeout(() => { clearInterval(t2); run((k + 1) % BREATH_PHASES.length); }, ph.secs * 1000);
                }
                run(0);
                return () => { clearTimeout(t1); clearInterval(t2); };
            }, []);
            const ph = BREATH_PHASES[idx];
            return (
                <div class="text-center">
                    <div class="relative flex items-center justify-center mx-auto" style={{ width: '160px', height: '160px' }}>
                        <div class="absolute rounded-full bg-primary-100" style={{ width: '150px', height: '150px' }}></div>
                        <div class="absolute rounded-full bg-gradient-to-br from-primary-400 to-primary-600"
                            style={{ width: '120px', height: '120px', transform: `scale(${ph.scale})`, transition: `transform ${ph.secs}s ease-in-out` }}></div>
                        <div class="relative text-white">
                            <div class="text-base font-bold">{ph.label}</div>
                            <div class="text-3xl font-extrabold tabular-nums">{count}</div>
                        </div>
                    </div>
                    <button type="button" onClick={onBack}
                        class="mt-4 text-xs text-ink-400 hover:text-red-500 transition"><Icon n="chevron-left" s={13} cls="mr-0.5" /> เลือกใหม่</button>
                </div>
            );
        }

        // แบบฝึกดึงสติ 5-4-3-2-1 (grounding ผ่านประสาทสัมผัส) — พาใจกลับมาอยู่กับปัจจุบัน
        const GROUND_STEPS = [
            { n: 5, icon: '👀', sense: 'สิ่งที่คุณ มองเห็น', hint: 'มองรอบตัว ค่อยๆ นับทีละอย่าง' },
            { n: 4, icon: '👂', sense: 'เสียงที่คุณ ได้ยิน', hint: 'ตั้งใจฟังเสียงรอบๆ ตัว' },
            { n: 3, icon: '✋', sense: 'สิ่งที่คุณ สัมผัสได้', hint: 'รู้สึกถึงพื้น ผ้า หรือมือของคุณ' },
            { n: 2, icon: '👃', sense: 'กลิ่นที่คุณ ได้กลิ่น', hint: 'หายใจเข้าช้าๆ ลองดมกลิ่นรอบตัว' },
            { n: 1, icon: '🫶', sense: 'สิ่งดีๆ ในตัวคุณ', hint: 'บอกกับตัวเองว่า “ฉันปลอดภัยตอนนี้”' },
        ];
        function GroundingExercise({ onBack }) {
            const [step, setStep] = React.useState(0);
            const [ticked, setTicked] = React.useState(0);
            const [done, setDone] = React.useState(false);
            const s = GROUND_STEPS[step];
            function tick(i) { if (i + 1 > ticked) setTicked(i + 1); }
            function next() {
                if (step < GROUND_STEPS.length - 1) { setStep(step + 1); setTicked(0); }
                else setDone(true);
            }
            if (done) return (
                <div class="text-center py-2">
                    <div class="text-4xl mb-2">🌿</div>
                    <p class="text-sm text-ink-600 font-medium mb-1">กลับมาอยู่กับปัจจุบันแล้วนะ</p>
                    <p class="text-xs text-ink-400 mb-4">ค่อยๆ หายใจ คุณทำได้ดีมาก</p>
                    <button type="button" onClick={onBack}
                        class="text-xs text-ink-400 hover:text-primary-600 transition"><Icon n="chevron-left" s={13} cls="mr-0.5" /> เลือกใหม่</button>
                </div>
            );
            return (
                <div class="text-center">
                    <div class="flex items-center justify-center gap-1.5 mb-4">
                        {GROUND_STEPS.map((_, i) => (
                            <div key={i} class={`h-1.5 rounded-full transition-all ${i === step ? 'w-6 bg-primary-500' : i < step ? 'w-3 bg-primary-300' : 'w-3 bg-paper-200'}`}></div>
                        ))}
                    </div>
                    <div class="text-4xl mb-1">{s.icon}</div>
                    <div class="text-2xl font-extrabold text-primary-600 leading-none mb-1">{s.n}</div>
                    <p class="text-sm font-semibold text-ink-700">{s.sense}</p>
                    <p class="text-xs text-ink-400 mb-4">{s.hint}</p>
                    <div class="flex items-center justify-center gap-2 mb-4">
                        {Array.from({ length: s.n }).map((_, i) => (
                            <button key={i} type="button" onClick={() => tick(i)}
                                class={`w-8 h-8 rounded-full border-2 transition-all ${i < ticked ? 'bg-primary-500 border-primary-500 text-white' : 'border-paper-300 text-ink-300 hover:border-primary-300'}`}>
                                {i < ticked ? '✓' : i + 1}
                            </button>
                        ))}
                    </div>
                    <button type="button" onClick={next} disabled={ticked < s.n}
                        class="px-5 py-2 rounded-full bg-primary-500 text-white text-sm font-semibold hover:bg-primary-600 transition disabled:opacity-40">
                        {step < GROUND_STEPS.length - 1 ? 'ถัดไป ›' : 'เสร็จแล้ว 🌿'}
                    </button>
                    <div><button type="button" onClick={onBack}
                        class="mt-3 text-xs text-ink-400 hover:text-red-500 transition"><Icon n="chevron-left" s={13} cls="mr-0.5" /> เลือกใหม่</button></div>
                </div>
            );
        }

        // การ์ดผ่อนคลายระหว่างรอ — เลือกระหว่างหายใจ 4-7-8 หรือดึงสติ 5-4-3-2-1
        function CalmTools() {
            const [mode, setMode] = React.useState(null);
            return (
                <div class="card-playful bg-surface overflow-hidden mt-4 p-5">
                    {mode === null ? (
                        <div class="text-center">
                            <p class="text-sm text-ink-500 mb-4">ระหว่างรอ ลองพาใจให้สงบดูไหม? 🌸</p>
                            <div class="flex flex-col sm:flex-row gap-2 justify-center">
                                <button type="button" onClick={() => setMode('breath')}
                                    class="px-4 py-2.5 rounded-full bg-primary-500 text-white text-sm font-semibold hover:bg-primary-600 transition">
                                    🧘 หายใจ 4-7-8
                                </button>
                                <button type="button" onClick={() => setMode('ground')}
                                    class="px-4 py-2.5 rounded-full bg-paper-100 text-ink-600 text-sm font-semibold border border-line hover:bg-paper-50 transition">
                                    🌿 ดึงสติ 5-4-3-2-1
                                </button>
                            </div>
                        </div>
                    ) : mode === 'breath' ? (
                        <BreathingExercise onBack={() => setMode(null)} />
                    ) : (
                        <GroundingExercise onBack={() => setMode(null)} />
                    )}
                </div>
            );
        }

        function StepIndicator({ status }) {
            const steps = [
                { key: 'joining', label: 'เข้าคิว' },
                { key: 'waiting', label: 'รอจับคู่' },
                { key: 'matched', label: 'จับคู่สำเร็จ' },
            ];
            const order = { joining: 0, waiting: 1, matched: 2 };
            const activeIdx = order[status] ?? 0;
            return (
                <div class="flex items-center justify-center gap-2 mb-8">
                    {steps.map((s, i) => (
                        <React.Fragment key={s.key}>
                            <div class="flex flex-col items-center gap-1.5">
                                <div class={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300 ${
                                    i < activeIdx ? 'bg-primary-500 text-white' :
                                    i === activeIdx ? 'bg-primary-500 text-white ring-4 ring-primary-100' :
                                    'bg-paper-200 text-ink-400'
                                }`}>
                                    {i < activeIdx ? '✓' : i + 1}
                                </div>
                                <span class={`text-[10px] font-medium ${i <= activeIdx ? 'text-primary-600' : 'text-ink-300'}`}>{s.label}</span>
                            </div>
                            {i < steps.length - 1 && (
                                <div class={`w-10 sm:w-16 h-0.5 mb-4 rounded transition-colors duration-300 ${i < activeIdx ? 'bg-primary-500' : 'bg-paper-200'}`}></div>
                            )}
                        </React.Fragment>
                    ))}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [queueStatus, setQueueStatus] = useState('joining');
            const [waitTime, setWaitTime] = useState(0);
            const [error, setError] = useState(null);
            const [burnout, setBurnout] = useState(null);   // กันผู้ฟังหมดไฟ: {reason, count}
            const bypassRef = React.useRef(false);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            const LISTEN_LIMIT = 5;  // จำนวนครั้งรับฟังต่อวันก่อนชวนพัก (soft)
            function proceedAnyway() { bypassRef.current = true; setBurnout(null); setQueueStatus('joining'); init(); }
            function restToday() {
                const end = new Date(); end.setHours(23, 59, 59, 0);
                try { localStorage.setItem('nomgi_rest_until', String(end.getTime())); } catch (e) {}
                window.location.href = 'index.html';
            }

            function toggleDarkMode() {
                const resolved = window.BlissiamTheme?.toggleColorScheme();
                setIsDark(resolved === 'dark');
            }

            const urlParams = new URLSearchParams(window.location.search);
            const selectedRole = urlParams.get('role') || 'venter';
            const selectedIdentity = urlParams.get('identity') === 'revealed' ? 'revealed' : 'anonymous';
            const selectedTopic = urlParams.get('topic') || 'general';
            const selectedSupport = ['listen','advice','company'].includes(urlParams.get('support')) ? urlParams.get('support') : null;

            useEffect(() => {
                window.BlissiamTheme?.loadAndApplyTheme();
                
                // แก้ไข: ดักจับ Error การขอ Notification อย่างปลอดภัย
                if (window.Notification && Notification.permission === 'default') {
                    try {
                        const permissionPromise = Notification.requestPermission();
                        if (permissionPromise && typeof permissionPromise.catch === 'function') {
                            permissionPromise.catch(console.warn);
                        }
                    } catch (err) {
                        console.warn('Notification permission error:', err);
                    }
                }
                init();
            }, []);

            useEffect(() => {
                if (queueStatus === 'waiting') {
                    const timer = setInterval(() => setWaitTime(t => t + 1), 1000);
                    return () => clearInterval(timer);
                }
            }, [queueStatus]);

            // Heartbeat ระหว่างรอคิว: อัปเดต last_seen ทุก 20 วิ ให้ระบบรู้ว่าเรายังรออยู่จริง
            // (ฟังก์ชัน match_users จับคู่เฉพาะคน last_seen สดใหม่ ถ้าไม่เต้นจะโดนมองเป็นผี)
            useEffect(() => {
                if (queueStatus !== 'waiting' || !user) return;
                const beat = () => supabase.from('profiles')
                    .update({ status: 'waiting', last_seen: new Date().toISOString() })
                    .eq('id', user.id);
                const iv = setInterval(beat, 20000);
                return () => clearInterval(iv);
            }, [queueStatus, user]);

            async function init() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setUser(session.user);

                    // กันผู้ฟังหมดไฟ: ถ้ารับฟังในฐานะ listener บ่อยเกินไปวันนี้ หรือกำลังพักอยู่ → ชวนพัก (นุ่มนวล ไม่บังคับ)
                    if (selectedRole === 'listener' && !bypassRef.current) {
                        let restUntil = 0;
                        try { restUntil = Number(localStorage.getItem('nomgi_rest_until') || 0); } catch (e) {}
                        if (Date.now() < restUntil) { setBurnout({ reason: 'rest' }); setQueueStatus('gate'); return; }
                        const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
                        try {
                            const { count } = await supabase.from('rooms')
                                .select('id', { count: 'exact', head: true })
                                .eq('listener_id', session.user.id)
                                .gte('created_at', todayStart.toISOString());
                            if ((count || 0) >= LISTEN_LIMIT) { setBurnout({ reason: 'limit', count }); setQueueStatus('gate'); return; }
                        } catch (e) { /* ถ้าเช็คไม่ได้ ก็ปล่อยผ่าน */ }
                    }

                    // หาห้องที่ยัง active ของเรา — แต่ต้องเช็คว่าคู่สนทนายังอยู่จริงก่อน
                    // ไม่งั้นจะโดนโยนกลับเข้าห้องร้างที่อีกฝ่ายปิดแท็บหนีไปแล้ว
                    const { data: activeRooms } = await supabase
                        .from('rooms')
                        .select('id, venter_id, listener_id')
                        .or(`venter_id.eq.${session.user.id},listener_id.eq.${session.user.id}`)
                        .eq('status', 'active');

                    const PRESENCE_WINDOW = 60 * 1000; // ถือว่ายังอยู่ถ้า last_seen ภายใน 60 วิ
                    for (const room of (activeRooms || [])) {
                        const partnerId = room.venter_id === session.user.id ? room.listener_id : room.venter_id;
                        const { data: partnerProfile } = await supabase
                            .from('public_profiles').select('last_seen, status').eq('id', partnerId).maybeSingle();
                        const partnerPresent = partnerProfile && partnerProfile.status === 'in_chat'
                            && partnerProfile.last_seen
                            && (Date.now() - new Date(partnerProfile.last_seen).getTime() < PRESENCE_WINDOW);
                        if (partnerPresent) {
                            window.location.href = 'chat.html?room=' + room.id;
                            return;
                        }
                        // คู่สนทนาไม่อยู่แล้ว → ปิดห้องร้างทิ้ง แล้วไปเข้าคิวหาคนใหม่
                        await supabase.from('rooms')
                            .update({ status: 'closed', ended_at: new Date().toISOString(), ended_by: session.user.id })
                            .eq('id', room.id);
                    }

                    await supabase.from('profiles').update({
                        status: 'waiting',
                        role_preference: selectedRole,
                        last_seen: new Date().toISOString()
                    }).eq('id', session.user.id);

                    // ล้างคิวเก่าของตัวเองที่ยังค้าง (กันมีหลายคิวซ้อน)
                    await supabase.from('queue')
                        .update({ status: 'cancelled' })
                        .eq('user_id', session.user.id)
                        .eq('status', 'waiting');

                    const queuePayload = {
                        user_id: session.user.id,
                        role: selectedRole,
                        identity_mode: selectedIdentity,
                        topic: selectedTopic,
                        status: 'waiting'
                    };
                    if (selectedSupport) queuePayload.support_type = selectedSupport;

                    let { error: queueError } = await supabase.from('queue').insert(queuePayload);
                    // ถ้ายังไม่ได้รัน SQL (คอลัมน์ support_type ยังไม่มี) ให้ลองใหม่โดยไม่ใส่
                    if (queueError && selectedSupport && /support_type/i.test(queueError.message || '')) {
                        delete queuePayload.support_type;
                        ({ error: queueError } = await supabase.from('queue').insert(queuePayload));
                    }

                    if (queueError) throw queueError;
                    setQueueStatus('waiting');

                    const channel = supabase.channel('queue-status-' + session.user.id)
                        .on('postgres_changes', {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'queue',
                            filter: 'user_id=eq.' + session.user.id
                        }, (payload) => {
                            if (payload.new.status === 'matched' && payload.new.matched_room_id) {
                                setQueueStatus('matched');
                                playMatchSound();
                                if (window.Notification && Notification.permission === 'granted') {
                                    new Notification('NomGI 🌟', {
                                        body: 'เราพบคู่สนทนาของคุณแล้ว! เข้ามาเริ่มพูดคุยกันได้เลยครับ',
                                    });
                                }
                                setTimeout(() => {
                                    window.location.href = 'chat.html?room=' + payload.new.matched_room_id;
                                }, 1500);
                            }
                        })
                        .subscribe();

                } catch (err) {
                    setError('ไม่สามารถเข้าคิวได้: ' + err.message);
                }
            }

            async function cancelQueue() {
                if (!user) return;
                await supabase.from('queue').update({ status: 'cancelled' }).eq('user_id', user.id);
                await supabase.from('profiles').update({ status: 'offline' }).eq('id', user.id);
                window.location.href = 'index.html';
            }

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const getTopicLabel = (id) => {
                const topics = { 
                    general:'เรื่องทั่วไป 💬', 
                    study:'การเรียน/มหาลัย 📚', 
                    love:'ความรัก ❤️', 
                    work:'การทำงาน 💼', 
                    family:'ครอบครัว 🏠', 
                    health:'สุขภาพจิต 🧠' 
                };
                return topics[id] || 'เรื่องทั่วไป';
            };

            if (error) return (
                <div class="min-h-screen flex items-center justify-center p-6">
                    <div class="bg-surface border border-line p-8 rounded-3xl max-w-md text-center">
                        <h2 class="text-xl font-bold text-red-500 mb-2">เกิดข้อผิดพลาด</h2>
                        <p class="text-ink-500 mb-6">{error}</p>
                        <a href="index.html" class="bg-primary-500 text-white px-6 py-3 rounded-full inline-block">กลับหน้าแรก</a>
                    </div>
                </div>
            );

            return (
                <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
                    {queueStatus === 'waiting' && (
                        <>
                            <div class="fixed inset-0 z-0 waiting-illustration"></div>
                            <div class="fixed inset-0 z-0 waiting-overlay"></div>
                        </>
                    )}
                    {queueStatus !== 'waiting' && (
                        <>
                            <div class="blob w-72 h-72 bg-primary-300 opacity-20 -top-10 -left-16"></div>
                            <div class="blob w-64 h-64 bg-secondary-300 opacity-20 -bottom-16 -right-10" style={{ animationDelay: '2s' }}></div>
                        </>
                    )}
                    <div class="absolute top-6 right-6 z-20">
                        <DarkModeToggle isDark={isDark} onToggle={toggleDarkMode} />
                    </div>
                    <div class="absolute top-10 left-1/2 -translate-x-1/2 pointer-events-none select-none">
                        <span class="watermark">NOMGI</span>
                    </div>

                    <div class="relative z-10 max-w-md w-full">
                        {queueStatus !== 'joining' && queueStatus !== 'gate' && <StepIndicator status={queueStatus} />}
                        <div class="card-playful bg-surface p-6 sm:p-8 text-center">
                            {queueStatus === 'joining' && (
                                <div>
                                    <div class="flex justify-center mb-6">
                                        <DotLogo size={36} animated={true} />
                                    </div>
                                    <h2 class="text-xl font-bold text-ink-900">กำลังเตรียมพื้นที่แชท...</h2>
                                </div>
                            )}

                            {queueStatus === 'gate' && (
                                <div class="fade-in">
                                    <div class="text-4xl mb-3">🫖</div>
                                    <h2 class="text-xl font-bold text-ink-900 mb-1">พักสักหน่อยไหม?</h2>
                                    <p class="text-sm text-ink-500 mb-5">
                                        {burnout?.reason === 'rest'
                                            ? 'วันนี้คุณเลือกพักการรับฟังไว้ · การดูแลใจตัวเองสำคัญไม่แพ้การดูแลคนอื่นนะ'
                                            : `วันนี้คุณรับฟังมาแล้ว ${burnout?.count || LISTEN_LIMIT} ครั้ง เก่งมากเลย 💚 การรับฟังเรื่องหนักๆ ใช้พลังใจเยอะ ลองพักเติมพลังก่อนไหม?`}
                                    </p>
                                    <div class="flex flex-col gap-2">
                                        <button onClick={restToday} class="w-full py-3 rounded-2xl bg-primary-500 text-white font-semibold text-sm hover:bg-primary-600 transition">พักวันนี้ · กลับหน้าแรก</button>
                                        <button onClick={proceedAnyway} class="w-full py-2.5 rounded-2xl border border-line text-ink-600 font-medium text-sm hover:bg-paper-100 transition">ยังไหว รับฟังต่อ</button>
                                    </div>
                                </div>
                            )}

                            {queueStatus === 'waiting' && (
                                <div class="fade-in">
                                    <div class="flex justify-center mb-6">
                                        <DotLogo size={48} animated={true} />
                                    </div>

                                    <h2 class="text-2xl font-bold text-ink-900 mb-2">
                                        {selectedRole === 'venter' ? 'กำลังหาคนพร้อมรับฟัง...' : 'กำลังหาคนอยากระบาย...'}
                                    </h2>
                                    <p class="text-ink-500 text-sm mb-4">ในหัวข้อ: <strong class="text-primary-600">{getTopicLabel(selectedTopic)}</strong></p>

                                    <div class="inline-flex items-center gap-1.5 text-xs font-medium text-ink-500 bg-paper-100 border border-line rounded-full px-3 py-1 mb-6">
                                        <span class={`w-1.5 h-1.5 rounded-full ${selectedIdentity === 'revealed' ? 'bg-primary-500' : 'bg-ink-900'}`}></span>
                                        โหมด{selectedIdentity === 'revealed' ? 'ระบุตัวตน' : 'ไม่ระบุตัวตน'}
                                    </div>

                                    <p class="text-xs text-ink-400 mb-6 flex items-center justify-center gap-1.5">
                                        <span class="w-1 h-1 rounded-full bg-primary-400 inline-block"></span>
                                        รออยู่เป็นเพื่อนคุณมา {formatTime(waitTime)} นาที · ไม่ต้องรีบนะ
                                    </p>

                                    <button onClick={cancelQueue} class="text-ink-400 hover:text-ink-600 transition text-sm">
                                        ออกจากคิว
                                    </button>
                                </div>
                            )}

                            {queueStatus === 'matched' && (
                                <div class="fade-in">
                                    <div class="flex justify-center mb-6">
                                        <DotLogo size={40} />
                                    </div>
                                    <h2 class="text-2xl font-bold text-primary-600 mb-2">จับคู่สำเร็จแล้ว! 🎉</h2>
                                    <p class="text-ink-500 text-sm">ระบบกำลังพาคุณเข้าสู่พื้นที่ห้องสนทนาปลอดภัย...</p>
                                </div>
                            )}
                        </div>

                        {queueStatus === 'waiting' && <WaitingCompanion waitTime={waitTime} />}
                        {queueStatus === 'waiting' && <CalmTools />}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
