<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการ | NomGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                    colors: {
                        paper: {
                            50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)',
                            200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)'
                        },
                        ink: {
                            900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)',
                            400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)'
                        },
                        surface: 'var(--color-surface)',
                        primary: {
                            50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)', 400: 'var(--color-primary-400)', 500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)'
                        },
                        secondary: {
                            50: 'var(--color-secondary-50)', 100: 'var(--color-secondary-100)', 200: 'var(--color-secondary-200)',
                            300: 'var(--color-secondary-300)', 400: 'var(--color-secondary-400)', 500: 'var(--color-secondary-500)',
                            600: 'var(--color-secondary-600)'
                        },
                        line: 'var(--color-line)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-100: #e3ece0; --color-primary-200: #c5dcc0;
            --color-primary-300: #9dc295; --color-primary-400: #739e6b; --color-primary-500: #4D7355;
            --color-primary-600: #3d5d44; --color-primary-700: #314936;
            --color-secondary-50: #fbf3ea; --color-secondary-100: #f3e0c8; --color-secondary-200: #e6bf8e;
            --color-secondary-300: #cc9655; --color-secondary-400: #A8662A; --color-secondary-500: #925621; --color-secondary-600: #74441a;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #9c9c9c; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
        body { font-family: 'Kanit', sans-serif; background-color: var(--color-paper-50); background-image: radial-gradient(circle at 15% 10%, var(--color-primary-50) 0%, transparent 45%), radial-gradient(circle at 85% 90%, var(--color-secondary-50) 0%, transparent 45%); background-attachment: fixed; transition: background-color 0.3s ease; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background: var(--color-primary-50); color: var(--color-primary-600); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dot-pulse circle { animation: dotPulse 1.4s ease-in-out infinite; }
        .dot-pulse circle:nth-child(1) { animation-delay: 0s; }
        .dot-pulse circle:nth-child(2) { animation-delay: 0.1s; }
        .dot-pulse circle:nth-child(3) { animation-delay: 0.2s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        .wiggle-hover:hover { animation: wiggle 0.4s ease-in-out; }
        .sidebar-item.active { border-radius: 9999px; }
        .stat-card-playful { border-radius: 1.5rem; overflow: hidden; box-shadow: 0 12px 30px -14px var(--color-primary-500); border: 1px solid color-mix(in srgb, var(--color-primary-500) 12%, var(--color-line)); }
    </style>
    <script src="theme.js"></script>
    <script src="pwa.js"></script>
</head>
<body class="h-screen text-ink-900 overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = window.supabaseClient;

        function DotLogo({ size = 28, animated = false }) {
            return (
                <svg width={size} height={size} viewBox="0 0 28 28" fill="none" class={`wiggle-hover ${animated ? 'dot-pulse' : ''}`}>
                    <circle cx="4" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="4" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="4" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="14" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="14" r="3" fill="var(--color-primary-500)"/><circle cx="24" cy="14" r="3" fill="var(--color-ink-900)"/>
                    <circle cx="4" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="14" cy="24" r="3" fill="var(--color-ink-900)"/><circle cx="24" cy="24" r="3" fill="var(--color-ink-900)"/>
                </svg>
            );
        }

        const getTopicLabel = (id) => {
            const t = { general:'ทั่วไป 💬', study:'การเรียน 📚', love:'ความรัก ❤️', work:'การทำงาน 💼', family:'ครอบครัว 🏠', health:'สุขภาพจิต 🧠' };
            return t[id] || id;
        };

        function DarkModeToggle({ isDark, onToggle }) {
            return (
                <button type="button" onClick={onToggle} title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    class="w-9 h-9 rounded-full flex items-center justify-center border border-line bg-surface hover:border-primary-400 transition text-ink-700 hover:text-primary-600 shrink-0">
                    {isDark ? (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    ) : (
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    )}
                </button>
            );
        }

        function BarChart({ data }) {
            const max = Math.max(...data.map(d => d.count), 1);
            return (
                <div class="flex items-end justify-between gap-2 h-40 px-1">
                    {data.map((d, i) => (
                        <div key={i} class="flex-1 flex flex-col items-center gap-2 group">
                            <span class="text-xs font-semibold text-ink-700 opacity-0 group-hover:opacity-100 transition">{d.count}</span>
                            <div class="w-full bg-paper-100 rounded-lg overflow-hidden flex items-end" style={{ height: '112px' }}>
                                <div class="w-full bg-primary-500 rounded-lg transition-all duration-500 group-hover:bg-primary-600"
                                    style={{ height: `${Math.max((d.count / max) * 100, d.count > 0 ? 6 : 0)}%` }}></div>
                            </div>
                            <span class="text-[10px] text-ink-400">{d.label}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [stats, setStats] = useState({
                totalUsers: 0, activeRooms: 0, waitingQueue: 0, totalReports: 0,
                messagesToday: 0, roomsClosedToday: 0, bannedUsers: 0, onlineUsers: 0, totalKudos: 0
            });
            const [topicBreakdown, setTopicBreakdown] = useState({});
            const [messagesByDay, setMessagesByDay] = useState([]);
            const [moodByDay, setMoodByDay] = useState([]);
            const [moodSummary, setMoodSummary] = useState({ total: 0, avg: 0 });
            const [ratingSummary, setRatingSummary] = useState({ total: 0, avg: 0 });
            const [queue, setQueue] = useState([]);
            const [rooms, setRooms] = useState([]);
            const [reports, setReports] = useState([]);
            const [reportCounts, setReportCounts] = useState({ pending: 0, resolved: 0, dismissed: 0 });
            const [reportFilter, setReportFilter] = useState('pending');
            const [reportSearch, setReportSearch] = useState('');
            const [users, setUsers] = useState([]);
            const [appeals, setAppeals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedThemeKey, setSelectedThemeKey] = useState('sage');
            const [selectedFontKey, setSelectedFontKey] = useState('kanit');
            const [savingTheme, setSavingTheme] = useState(false);
            const [themeSaved, setThemeSaved] = useState(false);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            function toggleDarkMode() {
                const resolved = window.BlissiamTheme?.toggleColorScheme();
                setIsDark(resolved === 'dark');
            }

            useEffect(() => {
                window.BlissiamTheme?.loadAndApplyTheme();
                checkAdmin();
            }, []);

            useEffect(() => {
                if (isAdmin) {
                    loadData();
                    const interval = setInterval(loadData, 5000);
                    return () => clearInterval(interval);
                }
            }, [isAdmin, reportFilter]);

            async function checkAdmin() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'admin-login.html';
                    return;
                }
                setUser(session.user);

                const { data: profile } = await supabase.from('profiles').select('status').eq('id', session.user.id).single();
                if (profile?.status !== 'admin') {
                    await supabase.auth.signOut();
                    window.location.href = 'admin-login.html';
                    return;
                }
                setIsAdmin(true);
                setLoading(false);

                const { data: settings } = await supabase.from('site_settings').select('theme_key, font_key').eq('id', 1).single();
                if (settings) {
                    setSelectedThemeKey(settings.theme_key);
                    setSelectedFontKey(settings.font_key);
                }
            }

            async function loadData() {
                const todayStart = new Date();
                todayStart.setHours(0, 0, 0, 0);
                const todayIso = todayStart.toISOString();

                const [
                    { count: userCount },
                    { count: roomCount },
                    { count: queueCount },
                    { count: reportCount },
                    { count: messagesToday },
                    { count: roomsClosedToday },
                    { count: bannedUsers },
                    { count: onlineUsers },
                ] = await Promise.all([
                    supabase.from('profiles').select('*', { count: 'exact', head: true }),
                    supabase.from('rooms').select('*', { count: 'exact', head: true }).eq('status', 'active'),
                    supabase.from('queue').select('*', { count: 'exact', head: true }).eq('status', 'waiting'),
                    supabase.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
                    supabase.from('messages').select('*', { count: 'exact', head: true }).gte('created_at', todayIso),
                    supabase.from('rooms').select('*', { count: 'exact', head: true }).eq('status', 'closed').gte('ended_at', todayIso),
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('is_banned', true),
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).in('status', ['online', 'in_chat', 'waiting']),
                ]);

                const { data: kudosRows } = await supabase.from('profiles').select('kudos_count');
                const totalKudos = (kudosRows || []).reduce((sum, p) => sum + (p.kudos_count || 0), 0);

                setStats({
                    totalUsers: userCount || 0,
                    activeRooms: roomCount || 0,
                    waitingQueue: queueCount || 0,
                    totalReports: reportCount || 0,
                    messagesToday: messagesToday || 0,
                    roomsClosedToday: roomsClosedToday || 0,
                    bannedUsers: bannedUsers || 0,
                    onlineUsers: onlineUsers || 0,
                    totalKudos
                });

                const { data: queueData } = await supabase.from('queue').select('*, profiles:user_id(display_name, status)').eq('status', 'waiting').order('created_at', { ascending: true });
                setQueue(queueData || []);

                const topics = {};
                (queueData || []).forEach(q => {
                    const t = q.topic || 'general';
                    topics[t] = (topics[t] || 0) + 1;
                });
                setTopicBreakdown(topics);

                const { data: roomsData } = await supabase.from('rooms').select('*, venter:venter_id(display_name), listener:listener_id(display_name)').eq('status', 'active').order('created_at', { ascending: false });
                setRooms(roomsData || []);

                const [
                    { count: pendingCount },
                    { count: resolvedCount },
                    { count: dismissedCount },
                ] = await Promise.all([
                    supabase.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
                    supabase.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'resolved'),
                    supabase.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'dismissed'),
                ]);
                setReportCounts({ pending: pendingCount || 0, resolved: resolvedCount || 0, dismissed: dismissedCount || 0 });

                const { data: reportsData } = await supabase.from('reports').select('*, reporter:reporter_id(display_name), reported:reported_user_id(display_name)').eq('status', reportFilter).order('created_at', { ascending: false });
                setReports(reportsData || []);

                const { data: usersData } = await supabase.from('profiles').select('*').order('last_seen', { ascending: false }).limit(50);
                setUsers(usersData || []);

                // Batch D: คำอุทธรณ์การแบน
                try {
                    const { data: appealsData } = await supabase
                        .from('ban_appeals')
                        .select('*, user:user_id(display_name, is_banned)')
                        .order('created_at', { ascending: false })
                        .limit(50);
                    setAppeals(appealsData || []);
                } catch (e) { /* ตาราง ban_appeals ยังไม่ถูกสร้าง (ยังไม่ได้รัน SQL) */ }

                // กราฟข้อความย้อนหลัง 7 วัน
                const sevenDaysAgo = new Date(todayStart);
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 6);
                const { data: recentMessages } = await supabase.from('messages').select('created_at').gte('created_at', sevenDaysAgo.toISOString());
                const dayBuckets = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(todayStart);
                    d.setDate(d.getDate() - i);
                    dayBuckets.push({ date: d, label: d.toLocaleDateString('th-TH', { weekday: 'short' }), count: 0 });
                }
                (recentMessages || []).forEach(m => {
                    const d = new Date(m.created_at);
                    const bucket = dayBuckets.find(b => b.date.toDateString() === d.toDateString());
                    if (bucket) bucket.count++;
                });
                setMessagesByDay(dayBuckets);

                // #11 mood รวมของชุมชน (ไม่ระบุตัวตน) ย้อนหลัง 7 วัน + คะแนนเฉลี่ย
                try {
                    const { data: pings } = await supabase.from('mood_pings').select('score, created_at').gte('created_at', sevenDaysAgo.toISOString());
                    const moodBuckets = dayBuckets.map(b => ({ date: b.date, label: b.label, sum: 0, n: 0 }));
                    (pings || []).forEach(p => {
                        const d = new Date(p.created_at);
                        const bk = moodBuckets.find(b => b.date.toDateString() === d.toDateString());
                        if (bk) { bk.sum += p.score; bk.n++; }
                    });
                    setMoodByDay(moodBuckets.map(b => ({ label: b.label, avg: b.n ? b.sum / b.n : 0, n: b.n })));
                    const total = (pings || []).length;
                    const avg = total ? (pings.reduce((s, p) => s + p.score, 0) / total) : 0;
                    setMoodSummary({ total, avg });
                } catch (e) {}
                try {
                    const { data: rs } = await supabase.from('ratings').select('stars').gte('created_at', sevenDaysAgo.toISOString());
                    const total = (rs || []).length;
                    const avg = total ? (rs.reduce((s, r) => s + r.stars, 0) / total) : 0;
                    setRatingSummary({ total, avg });
                } catch (e) {}
            }

            // ระบบแบน/ปลดแบนผู้ใช้
            async function toggleBanUser(userId, currentBanStatus) {
                const actionText = currentBanStatus ? 'ปลดแบน' : 'ระงับบัญชี (แบน)';
                if (!confirm(`คุณแน่ใจหรือไม่ที่จะ ${actionText} ผู้ใช้นี้?`)) return;

                try {
                    await supabase.from('profiles').update({ 
                        is_banned: !currentBanStatus,
                        status: !currentBanStatus ? 'offline' : 'offline' // เตะออกจากระบบ
                    }).eq('id', userId);

                    // ถ้าแบน ให้เตะออกจากคิวและห้องที่ใช้อยู่ด้วย
                    if (!currentBanStatus) {
                        await supabase.from('queue').update({ status: 'cancelled' }).eq('user_id', userId).eq('status', 'waiting');
                        await supabase.from('rooms').update({ status: 'closed', ended_by: user.id }).or(`venter_id.eq.${userId},listener_id.eq.${userId}`).eq('status', 'active');
                    }

                    loadData();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            async function resolveReport(reportId) {
                await supabase.from('reports').update({ status: 'resolved', resolved_at: new Date().toISOString(), resolved_by: user.id }).eq('id', reportId);
                loadData();
            }

            async function dismissReport(reportId) {
                await supabase.from('reports').update({ status: 'dismissed', resolved_at: new Date().toISOString(), resolved_by: user.id }).eq('id', reportId);
                loadData();
            }

            // Batch D: อนุมัติคำอุทธรณ์ = ปลดแบนผู้ใช้ด้วย
            async function approveAppeal(appeal) {
                if (!confirm('อนุมัติคำอุทธรณ์และปลดแบนผู้ใช้นี้?')) return;
                try {
                    await supabase.from('ban_appeals').update({
                        status: 'approved', reviewed_at: new Date().toISOString(), reviewed_by: user.id
                    }).eq('id', appeal.id);
                    await supabase.from('profiles').update({ is_banned: false }).eq('id', appeal.user_id);
                    loadData();
                } catch (err) { alert('Error: ' + err.message); }
            }

            async function dismissAppeal(appealId) {
                if (!confirm('ปฏิเสธคำอุทธรณ์นี้? (ผู้ใช้ยังคงถูกแบน)')) return;
                try {
                    await supabase.from('ban_appeals').update({
                        status: 'dismissed', reviewed_at: new Date().toISOString(), reviewed_by: user.id
                    }).eq('id', appealId);
                    loadData();
                } catch (err) { alert('Error: ' + err.message); }
            }

            async function closeRoom(roomId) {
                if (!confirm('ต้องการปิดห้องนี้?')) return;
                await supabase.from('rooms').update({ status: 'closed', ended_at: new Date().toISOString(), ended_by: user.id }).eq('id', roomId);
                loadData();
            }

            async function saveTheme() {
                setSavingTheme(true);
                setThemeSaved(false);
                try {
                    const { error } = await supabase.from('site_settings').update({
                        theme_key: selectedThemeKey, font_key: selectedFontKey, updated_at: new Date().toISOString(), updated_by: user.id
                    }).eq('id', 1);
                    if (error) throw error;
                    window.BlissiamTheme?.applyTheme(selectedThemeKey, selectedFontKey);
                    setThemeSaved(true);
                    setTimeout(() => setThemeSaved(false), 3000);
                } catch (err) {
                    alert('บันทึกธีมไม่สำเร็จ: ' + err.message);
                } finally {
                    setSavingTheme(false);
                }
            }

            async function logout() {
                await supabase.auth.signOut();
                window.location.href = 'admin-login.html';
            }

            if (loading) return (
                <div class="h-full flex items-center justify-center bg-paper-50">
                    <DotLogo size={40} animated={true} />
                </div>
            );

            const tabs = [
                { id: 'dashboard', label: 'ภาพรวม', icon: 'M3 13.5h6v6.75H3v-6.75zM9 3h6v17.25H9V3zM15 8.25h6v12H15v-12z' },
                { id: 'queue', label: 'คิวรอ', icon: 'M12 6v6l4 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
                { id: 'rooms', label: 'ห้องแชท', icon: 'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-6l-4 4v-4z' },
                { id: 'reports', label: 'รายงาน', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' },
                { id: 'users', label: 'การจัดการผู้ใช้', icon: 'M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z' },
                { id: 'theme', label: 'ธีมเว็บไซต์', icon: 'M9.53 16.122a3 3 0 00-5.78 1.128 2.25 2.25 0 01-2.4 2.245 4.5 4.5 0 008.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 003.388-1.62m-5.043-.025a15.994 15.994 0 011.622-3.395m3.42 3.42a15.995 15.995 0 004.764-4.648l3.876-5.814a1.151 1.151 0 00-1.597-1.597L14.146 6.32a15.996 15.996 0 00-4.649 4.763m3.42 3.42a6.776 6.776 0 00-3.42-3.42' },
            ];

            return (
                <div class="h-full flex">

                                                            </div>
                                                            <div>
                                                                <div class={`font-medium ${u.is_banned ? 'text-red-500 line-through' : 'text-ink-900'}`}>{u.display_name}</div>
                                                                <div class="text-xs text-ink-300">
                                                                    {u.is_banned ? <span class="text-red-500">ถูกระงับบัญชี</span> : 
                                                                     (u.status === 'online' ? 'ออนไลน์' :
                                                                      u.status === 'in_chat' ? 'กำลังแชท' :
                                                                      u.status === 'waiting' ? 'รอคิว' : 'ออฟไลน์')}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td class="px-6 py-4">
                                                        <span class="inline-flex items-center gap-1 px-3 py-1 bg-yellow-50 text-secondary-600 rounded-full text-xs font-bold border border-yellow-100">
                                                            🌟 {u.kudos_count || 0}
                                                        </span>
                                                    </td>
                                                    <td class="px-6 py-4 text-sm text-ink-500">
                                                        {new Date(u.last_seen).toLocaleString('th-TH')}
                                                    </td>
                                                    <td class="px-6 py-4 text-center">
                                                        {u.status !== 'admin' && (
                                                            <button 
                                                                onClick={() => toggleBanUser(u.id, u.is_banned)}
                                                                class={`px-4 py-1.5 rounded-xl text-xs font-medium transition ${
                                                                    u.is_banned 
                                                                    ? 'bg-green-50 text-green-600 border border-green-200 hover:bg-green-100' 
                                                                    : 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100'
                                                                }`}
                                                            >
                                                                {u.is_banned ? 'ปลดแบน' : 'แบนผู้ใช้'}
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'theme' && (
                            <div class="fade-in max-w-3xl">
                                <h1 class="text-2xl font-bold text-ink-900 mb-2">ธีมเว็บไซต์</h1>
                                <p class="text-ink-500 mb-8">เลือกสีและฟอนต์ — ดูตัวอย่างทันทีบนหน้านี้ กดบันทึกเพื่อใช้กับทั้งเว็บ</p>

                                <div class="bg-paper-100 border border-line rounded-2xl p-6 mb-6">
                                    <p class="text-xs text-ink-400 uppercase tracking-wide mb-2">ตัวอย่าง Preview</p>
                                    <h3 class="text-xl font-bold text-primary-600 mb-1">พื้นที่แบ่งปันน้ำใจ</h3>
                                    <p class="text-sm text-ink-500 mb-3">นี่คือตัวอย่างหน้าตาเว็บหลังเลือกธีม</p>
                                    <div class="flex gap-2">
                                        <span class="px-4 py-2 bg-primary-500 text-white rounded-full text-sm">ปุ่มหลัก</span>
                                        <span class="px-4 py-2 bg-secondary-500 text-white rounded-full text-sm">ปุ่มรอง</span>
                                    </div>
                                </div>

                                <div class="bg-surface rounded-2xl border border-line p-6 mb-6">
                                    <h3 class="font-bold text-ink-900 mb-4">ชุดสี</h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                        {Object.entries(window.BlissiamTheme?.THEME_PRESETS || {}).map(([key, preset]) => (
                                            <button
                                                key={key}
                                                onClick={() => {
                                            setSelectedThemeKey(key);
                                            window.BlissiamTheme?.applyTheme(key, selectedFontKey);
                                        }}
                                                class={`text-left p-4 rounded-xl border-2 transition ${selectedThemeKey === key ? 'border-ink-900' : 'border-line hover:border-ink-300'}`}
                                            >
                                                <div class="flex gap-1.5 mb-3">
                                                    <span class="w-7 h-7 rounded-full block" style={{backgroundColor: preset.primary[500]}}></span>
                                                    <span class="w-7 h-7 rounded-full block" style={{backgroundColor: preset.secondary[500]}}></span>
                                                </div>
                                                <div class="text-sm font-medium text-ink-900">{preset.label}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="bg-surface rounded-2xl border border-line p-6 mb-6">
                                    <h3 class="font-bold text-ink-900 mb-4">ฟอนต์</h3>
                                    <div class="grid grid-cols-2 gap-3">
                                        {Object.entries(window.BlissiamTheme?.FONT_SETS || {}).map(([key, font]) => (
                                            <button
                                                key={key}
                                                onClick={() => {
                                            setSelectedFontKey(key);
                                            window.BlissiamTheme?.applyTheme(selectedThemeKey, key);
                                        }}
                                                class={`text-left p-4 rounded-xl border-2 transition ${selectedFontKey === key ? 'border-ink-900' : 'border-line hover:border-ink-300'}`}
                                                style={{fontFamily: font.family}}
                                            >
                                                <div class="text-lg font-medium text-ink-900 mb-1">พื้นที่แบ่งปันน้ำใจ</div>
                                                <div class="text-xs text-ink-500" style={{fontFamily: 'Kanit, sans-serif'}}>{font.label}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="flex items-center gap-3">
                                    <button onClick={saveTheme} disabled={savingTheme} class="px-6 py-3 bg-ink-900 text-white rounded-full font-medium hover:bg-primary-600 transition disabled:opacity-50">
                                        {savingTheme ? 'กำลังบันทึก...' : 'บันทึกธีม'}
                                    </button>
                                    {themeSaved && <span class="text-primary-600 text-sm font-medium">บันทึกเรียบร้อยแล้ว ✓</span>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
