<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำแพงให้กำลังใจ | NomGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                colors: {
                    paper: { 50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)', 200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)' },
                    ink: { 900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)', 400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)' },
                    surface: 'var(--color-surface)',
                    primary: { 50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 200: 'var(--color-primary-200)', 300: 'var(--color-primary-300)', 400: 'var(--color-primary-400)', 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)' },
                    secondary: { 50: 'var(--color-secondary-50)', 100: 'var(--color-secondary-100)', 200: 'var(--color-secondary-200)', 300: 'var(--color-secondary-300)', 400: 'var(--color-secondary-400)', 500: 'var(--color-secondary-500)', 600: 'var(--color-secondary-600)' },
                    line: 'var(--color-line)'
                }
            } }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-100: #e3ece0; --color-primary-200: #c5dcc0;
            --color-primary-300: #9dc295; --color-primary-400: #739e6b; --color-primary-500: #4D7355;
            --color-primary-600: #3d5d44; --color-primary-700: #314936;
            --color-secondary-50: #fbf3ea; --color-secondary-100: #f3e0c8; --color-secondary-200: #e6bf8e;
            --color-secondary-300: #cc9655; --color-secondary-400: #A8662A; --color-secondary-500: #925621; --color-secondary-600: #74441a;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #9c9c9c; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
        body { font-family: 'Kanit', sans-serif; background-color: var(--color-paper-50); transition: background-color .3s ease; }
        .card-playful { border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px -16px rgba(51,73,47,.28); border: 1px solid var(--color-line); }
        @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
        .heart-pop { animation: pop .35s ease; }
    </style>
    <script src="theme.js"></script>
    <script src="pwa.js"></script>
    <script src="panic.js"></script>
    <script src="safety.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = window.supabaseClient;
        const _safety = window.NomGISafety || {};

        function DarkToggle({ isDark, onToggle }) {
            return (
                <button type="button" onClick={onToggle} title={isDark ? 'โหมดสว่าง' : 'โหมดมืด'}
                    class="w-9 h-9 rounded-full flex items-center justify-center border border-line bg-surface hover:border-primary-400 transition text-ink-700">
                    {isDark
                        ? <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        : <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>}
                </button>
            );
        }

        // โทนอ่อนๆ หมุนเวียนให้การ์ดกำลังใจดูเหมือนโน้ตที่แปะบนกำแพง (ไม่ใช่ลิสต์ขาวซ้ำๆ)
        const NOTE_TINTS = ['bg-primary-50', 'bg-secondary-50', 'bg-surface', 'bg-paper-100'];

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [posts, setPosts] = useState([]);
            const [myHearts, setMyHearts] = useState({});   // post_id -> true
            const [text, setText] = useState('');
            const [posting, setPosting] = useState(false);
            const [notice, setNotice] = useState(null);
            const [popId, setPopId] = useState(null);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            function toggleDark() { const r = window.BlissiamTheme?.toggleColorScheme(); setIsDark(r === 'dark'); }

            useEffect(() => {
                window.BlissiamTheme?.loadAndApplyTheme();
                init();
            }, []);

            async function init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html?redirect=wall.html'; return; }
                setUser(session.user);
                await load(session.user.id);
                setLoading(false);
            }

            async function load(uid) {
                const { data } = await supabase.from('wall_posts')
                    .select('id, text, hearts_count, status, created_at, user_id')
                    .order('created_at', { ascending: false }).limit(80);
                setPosts(data || []);
                const { data: hearts } = await supabase.from('wall_hearts').select('post_id').eq('user_id', uid);
                const map = {}; (hearts || []).forEach(h => { map[h.post_id] = true; });
                setMyHearts(map);
            }

            async function post() {
                const body = text.trim();
                if (!body || posting) return;
                setPosting(true); setNotice(null);
                const risky = _safety.isRisky && _safety.isRisky(body);
                const status = risky ? 'pending' : 'approved';
                const { data, error } = await supabase.from('wall_posts')
                    .insert({ user_id: user.id, text: body.slice(0, 200), status })
                    .select().single();
                setPosting(false);
                if (error) { setNotice('โพสต์ไม่สำเร็จ · ' + error.message); return; }
                setText('');
                if (risky) {
                    setNotice('เราเห็นว่าคุณอาจกำลังเจอเรื่องหนัก 💛 โพสต์ของคุณจะให้ทีมงานช่วยดูก่อน — และถ้าอยากคุยกับใคร โทร 1323 ได้ตลอด 24 ชม.');
                } else {
                    setNotice('ขอบคุณที่แบ่งปันกำลังใจ 🌷');
                }
                setPosts(prev => [data, ...prev]);
            }

            async function toggleHeart(p) {
                if (!user) return;
                const mine = !!myHearts[p.id];
                setPopId(p.id); setTimeout(() => setPopId(null), 360);
                setMyHearts(prev => { const n = { ...prev }; if (mine) delete n[p.id]; else n[p.id] = true; return n; });
                setPosts(prev => prev.map(x => x.id === p.id ? { ...x, hearts_count: Math.max(0, (x.hearts_count || 0) + (mine ? -1 : 1)) } : x));
                try {
                    if (mine) await supabase.from('wall_hearts').delete().eq('post_id', p.id).eq('user_id', user.id);
                    else await supabase.from('wall_hearts').insert({ post_id: p.id, user_id: user.id });
                } catch (e) {}
            }

            if (loading) return (
                <div class="min-h-screen flex items-center justify-center text-ink-400">กำลังโหลด…</div>
            );

            const visible = posts.filter(p => p.status === 'approved' || p.user_id === user.id);

            return (
                <div class="min-h-screen">
                    <header class="sticky top-0 z-20 bg-surface/80 backdrop-blur border-b border-line">
                        <div class="max-w-2xl mx-auto px-5 h-16 flex items-center justify-between">
                            <a href="index.html" class="text-sm text-ink-500 hover:text-primary-600 transition">‹ หน้าแรก</a>
                            <div class="font-bold text-ink-900">กำแพงให้กำลังใจ 💛</div>
                            <DarkToggle isDark={isDark} onToggle={toggleDark} />
                        </div>
                    </header>

                    <main class="max-w-2xl mx-auto px-5 py-6 space-y-5">
                        <p class="text-center text-sm text-ink-400">ทิ้งข้อความให้กำลังใจสั้นๆ แบบไม่เปิดเผยตัว · ใครผ่านมาก็มากดหัวใจให้กันได้</p>

                        <div class="card-playful bg-surface p-4">
                            <textarea value={text} onChange={e => setText(e.target.value.slice(0, 200))} rows="3"
                                placeholder="เขียนกำลังใจถึงใครสักคนที่อาจต้องการมันวันนี้..."
                                class="w-full bg-paper-50 border border-line rounded-2xl px-4 py-3 text-base resize-none focus:outline-none focus:ring-2 focus:ring-primary-500/30 placeholder:text-ink-400" />
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-xs text-ink-300">{text.length}/200</span>
                                <button type="button" onClick={post} disabled={!text.trim() || posting}
                                    class="px-5 py-2 rounded-full bg-primary-500 text-white text-sm font-semibold hover:bg-primary-600 transition disabled:opacity-40">
                                    {posting ? 'กำลังโพสต์…' : 'โพสต์กำลังใจ'}
                                </button>
                            </div>
                            {notice && <div class="mt-3 text-xs text-primary-700 bg-primary-50 border border-primary-100 rounded-xl px-3 py-2">{notice}</div>}
                        </div>

                        {visible.length === 0 ? (
                            <div class="text-center text-ink-300 text-sm py-10">ยังไม่มีข้อความ · เป็นคนแรกที่ทิ้งกำลังใจไว้ที่นี่ 🌱</div>
                        ) : (
                            <div class="grid sm:grid-cols-2 gap-3">
                                {visible.map((p, i) => (
                                    <div key={p.id} class={`card-playful ${p.status === 'pending' ? 'bg-surface' : NOTE_TINTS[i % NOTE_TINTS.length]} p-4 flex flex-col`}>
                                        <p class="text-ink-800 text-[15px] leading-relaxed whitespace-pre-wrap flex-1">{p.text}</p>
                                        <div class="flex items-center justify-between mt-3">
                                            <span class="text-[11px] text-ink-300">
                                                {p.status === 'pending' ? 'รอทีมงานตรวจ · เห็นเฉพาะคุณ' : new Date(p.created_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}
                                            </span>
                                            <button type="button" onClick={() => toggleHeart(p)}
                                                class={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold transition ${myHearts[p.id] ? 'bg-red-50 text-red-500' : 'bg-paper-100 text-ink-400 hover:text-red-400'}`}>
                                                <span class={popId === p.id ? 'heart-pop' : ''}>{myHearts[p.id] ? '❤️' : '🤍'}</span>
                                                {p.hearts_count || 0}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
