<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ห้องสนทนา | NomGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <link id="blissiam-font-link" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['var(--font-body)', 'Kanit', 'sans-serif'] },
                    colors: {
                        paper: {
                            50: 'var(--color-paper-50)', 100: 'var(--color-paper-100)',
                            200: 'var(--color-paper-200)', 300: 'var(--color-paper-300)'
                        },
                        ink: {
                            900: 'var(--color-ink-900)', 700: 'var(--color-ink-700)', 500: 'var(--color-ink-500)',
                            400: 'var(--color-ink-400)', 300: 'var(--color-ink-300)', 200: 'var(--color-ink-200)'
                        },
                        surface: 'var(--color-surface)',
                        primary: {
                            50: 'var(--color-primary-50)', 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)'
                        },
                        secondary: { 500: 'var(--color-secondary-500)', 600: 'var(--color-secondary-600)' },
                        line: 'var(--color-line)'
                    },
                    boxShadow: {
                        'chat': '0 2px 16px rgba(0,0,0,0.06)',
                        'float': '0 8px 32px rgba(0,0,0,0.12)',
                        'bubble': '0 1px 2px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary-50: #f3f7f1; --color-primary-500: #4D7355; --color-primary-600: #3d5d44;
            --color-secondary-500: #925621; --color-secondary-600: #74441a;
            --color-paper-50: #fdfcfa; --color-paper-100: #f6f3ee; --color-paper-200: #ece7de; --color-paper-300: #ddd6c9;
            --color-ink-900: #1a1a1a; --color-ink-700: #3a3a3a; --color-ink-500: #6b6b6b; --color-ink-400: #8a8a8a; --color-ink-300: #b0b0b0; --color-ink-200: #c2c2c2;
            --color-line: #e8e3d9; --color-surface: #ffffff;
            --font-body: 'Kanit', sans-serif;
        }
        body { font-family: 'Kanit', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-in { animation: msgIn 0.25s ease-out forwards; }
        @keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
        .typing-dot { animation: typingDot 1.2s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes sheetUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sheet-up { animation: sheetUp 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
        .glass { background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-dark { background: color-mix(in srgb, var(--color-surface) 75%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        .wiggle-hover:hover { animation: wiggle 0.4s ease-in-out; }
        /* พิธีกรรมปิดจบ: เปลวเทียน + ดาวลอย */
        @keyframes flameFlicker { 0%,100% { transform: scale(1) rotate(-1deg); opacity: 0.95; } 50% { transform: scale(1.12) rotate(2deg); opacity: 1; } }
        .flame { transform-origin: bottom center; animation: flameFlicker 0.9s ease-in-out infinite; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
        .float-star { animation: floatUp 2.4s ease-out forwards; }
        @keyframes warmthPop { 0% { transform: scale(0.4); opacity: 0; } 30% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .warmth-pop { animation: warmthPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-in { animation: toastIn 0.3s ease-out forwards; }
        @keyframes heartBeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.25); } 50% { transform: scale(0.95); } }
        .heart-beat { animation: heartBeat 0.7s ease-in-out; }
    </style>
    <script src="theme.js"></script>
    <script src="pwa.js"></script>
    <script src="panic.js"></script>
    <script src="chat-backgrounds.js"></script>
    <script src="chat-memes.js"></script>
    <script src="kudos-tree.js"></script>
    <script src="mood.js"></script>
    <script src="safety.js"></script>
</head>
<body class="h-screen text-ink-900">
    <div id="root" class="h-full"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const supabase = window.supabaseClient;
        const GIPHY_KEY = window.GIPHY_API_KEY || '';

        // Guard: ป้องกัน crash ถ้าสคริปต์โหลดไม่สำเร็จ
        const _memes = window.BlissiamMemes || {};
        const isMemeMessage = _memes.isMemeMessage || (() => false);
        const getMemeUrl = _memes.getMemeUrl || (() => '');
        const wrapMemeContent = _memes.wrapMemeContent || ((u) => u);
        const searchBuiltinMemes = _memes.searchBuiltinMemes || (() => []);
        const BUILTIN_MEMES = _memes.BUILTIN_MEMES || [];

        const _chatBg = window.BlissiamChatBg || {};
        const CHAT_BACKGROUNDS = _chatBg.CHAT_BACKGROUNDS || [];
        const getChatBackground = _chatBg.getChatBackground || (() => null);
        const getSavedChatBackgroundId = _chatBg.getSavedChatBackgroundId || (() => 'solid-cream');
        const saveChatBackgroundId = _chatBg.saveChatBackgroundId || (() => {});
        const applyChatBackgroundStyle = _chatBg.applyChatBackgroundStyle || (() => ({ backgroundColor: '#f8f6f1' }));
        const getChatBackgroundThumbStyle = _chatBg.getChatBackgroundThumbStyle || (() => ({}));

        const EMOJIS = ['😀','😂','🥺','❤️','👍','🙏','✨','😭','🥰','😅','🔥','👀','💪','🫂','🎉','😊','🤗','💯','🌟','🎈'];
        const REPORT_REASONS = ['พูดจาไม่เหมาะสม', 'คุกคาม / ข่มขู่', 'สแปม / โฆษณา', 'อื่นๆ'];

        const _safety = window.NomGISafety || {};
        const isRiskyText = _safety.isRisky || (() => false);
        const HOTLINES = _safety.HOTLINES || [];

        const QUICK_REACTIONS = ['❤️', '👍', '🫂', '😂', '🙏'];
        const SPECIALTY_LABEL = { general: 'เรื่องทั่วไป 💬', study: 'การเรียน 📚', love: 'ความรัก ❤️', work: 'การทำงาน 💼', family: 'ครอบครัว 🏠', health: 'สุขภาพจิต 🧠' };
        // เหรียญ "ผู้ฟังที่ไว้ใจได้" — รีวิว ≥3 ครั้ง และเฉลี่ย ≥4.3 ดาว
        function isTrustedListener(p) { return p && (p.rating_count || 0) >= 3 && Number(p.rating_avg || 0) >= 4.3; }
        // เหรียญ "ผ่านการอบรม" — ผ่านคอร์สปั้นผู้รับฟัง
        function isTrained(p) { return !!(p && p.trained_at); }

        // #4 ประโยคเปิดบทสนทนา (สำหรับคนที่ไม่รู้จะเริ่มยังไง)
        const ICE_BREAKERS = [
            'สวัสดีนะ วันนี้เป็นยังไงบ้าง? 🌿',
            'ยินดีที่ได้เจอกันนะ อยากเล่าอะไรก็เล่าได้เลย ไม่ต้องรีบ',
            'เราพร้อมรับฟังอยู่ตรงนี้นะ มีอะไรอยากระบายไหม?',
            'ช่วงนี้มีอะไรหนักใจอยู่หรือเปล่า?',
            'ไม่ต้องกังวลนะ ที่นี่ปลอดภัย อยากพูดแค่ไหนก็ได้',
            'วันนี้เจอเรื่องอะไรมาบ้าง อยากเล่าให้ฟังไหม?',
        ];
        // #5 การ์ดกำลังใจสำเร็จรูป (ส่งเร็ว)
        const ENCOURAGEMENTS = [
            'เก่งมากเลยนะที่ผ่านมาได้ถึงตรงนี้ 💪',
            'ไม่เป็นไรเลยที่จะรู้สึกแบบนั้น เรารับฟังอยู่นะ 🫂',
            'ขอบคุณที่ไว้ใจเล่าให้ฟังนะ 🌷',
            'เราอยู่ตรงนี้ด้วยเสมอ ไม่ต้องเผชิญคนเดียวนะ',
            'ค่อยๆ ก็ได้นะ ไม่ต้องรีบ ทุกความรู้สึกของเธอสำคัญ',
            'เธอมีค่ามากกว่าที่คิดไว้เยอะเลยนะ ✨',
        ];

        // Guard: ต้นไม้น้ำใจ + mood (กัน crash ถ้าไฟล์โหลดไม่สำเร็จ)
        const kudosPlantSvg = (window.NomGIKudos && window.NomGIKudos.plantSvg) || (() => '');
        const kudosStage = (window.NomGIKudos && window.NomGIKudos.stage) || (() => ({ level: 0, label: '' }));
        const NomGIMood = window.NomGIMood || { MOODS: [], commitAfter: () => {}, setPending: () => {} };
        const MOODS = NomGIMood.MOODS || [];

        const SUPPORT_LABELS = {
            listen:  { emoji: '👂', label: 'อยากให้แค่ฟัง' },
            advice:  { emoji: '💡', label: 'อยากได้คำแนะนำ' },
            company: { emoji: '🫂', label: 'อยากมีคนอยู่เป็นเพื่อน' },
        };

        function playMessageSound() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.07, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDayLabel(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const today = new Date();
            const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
            const sameDay = (a, b) => a.toDateString() === b.toDateString();
            if (sameDay(d, today)) return 'วันนี้';
            if (sameDay(d, yesterday)) return 'เมื่อวาน';
            return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
        }

        function IconBtn({ onClick, title, children, active }) {
            return (
                <button type="button" onClick={onClick} title={title}
                    class={`w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 ${active ? 'bg-primary-50 text-primary-600' : 'text-ink-500 hover:bg-black/5 hover:text-ink-900'}`}>
                    {children}
                </button>
            );
        }

        function DarkModeToggle({ isDark, onToggle }) {
            return (
                <IconBtn onClick={onToggle} title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}>
                    {isDark ? (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    ) : (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    )}
                </IconBtn>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [room, setRoom] = useState(null);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [partner, setPartner] = useState(null);
            const [partnerIdentity, setPartnerIdentity] = useState(null);
            const [partnerTyping, setPartnerTyping] = useState(false);
            const [showEndConfirm, setShowEndConfirm] = useState(false);
            const [reactions, setReactions] = useState([]); // [{message_id, user_id, emoji}]
            const [reactBarFor, setReactBarFor] = useState(null); // message id ที่กำลังเปิดแถบ react
            const [showCrisis, setShowCrisis] = useState(false);
            const [crisisDismissed, setCrisisDismissed] = useState(false);
            const [heavySession, setHeavySession] = useState(false);   // เจอเรื่องหนักในห้องนี้ (สำหรับ debrief ผู้ฟัง)
            const [restedToday, setRestedToday] = useState(false);
            const [showGuidelines, setShowGuidelines] = useState(() => { try { return !localStorage.getItem('nomgi_guidelines_ok'); } catch (e) { return false; } });
            const [showHelper, setShowHelper] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showMediaMenu, setShowMediaMenu] = useState(false);
            const [showBgPicker, setShowBgPicker] = useState(false);
            const [bgFilter, setBgFilter] = useState('all');
            const [chatBgId, setChatBgId] = useState(getSavedChatBackgroundId);
            const [mediaTab, setMediaTab] = useState('meme');
            const [giphyMemes, setGiphyMemes] = useState([]);
            const [memeSearch, setMemeSearch] = useState('');
            const [giphyLoading, setGiphyLoading] = useState(false);
            const [giphyError, setGiphyError] = useState(null);
            const [showReportModal, setShowReportModal] = useState(false);
            const [showHandoff, setShowHandoff] = useState(false); // ส่งต่ออย่างอบอุ่น (ผู้รับฟัง)
            const [reportReason, setReportReason] = useState(REPORT_REASONS[0]);
            const [reportDetails, setReportDetails] = useState('');
            const [kudosGiven, setKudosGiven] = useState(false);
            const [sendingMeme, setSendingMeme] = useState(false);
            const [soundEnabled, setSoundEnabled] = useState(() => localStorage.getItem('blissiam_sound') !== 'off');
            const [deletingId, setDeletingId] = useState(null);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            // พิธีกรรมปิดจบ (#3) + mood หลังคุย (#4)
            const [endStep, setEndStep] = useState('ask');       // 'ask' | 'mood' | 'farewell'
            const [afterMood, setAfterMood] = useState(null);
            const [reflectNote, setReflectNote] = useState('');
            const [ratingGiven, setRatingGiven] = useState(0);
            const [savedPartner, setSavedPartner] = useState(false);   // บันทึกคู่คุยไว้ reconnect
            // โหมดเงียบ/อยู่เป็นเพื่อน (#1)
            const [warmthToast, setWarmthToast] = useState(false);  // ได้รับไออุ่นจากคู่สนทนา
            const [warmthCooldown, setWarmthCooldown] = useState(0);
            const [nowTs, setNowTs] = useState(Date.now());

            function toggleDarkMode() {
                const resolved = window.BlissiamTheme?.toggleColorScheme();
                setIsDark(resolved === 'dark');
            }

            const messagesEndRef = useRef(null);
            const roomId = new URLSearchParams(window.location.search).get('room');

            const chatBg = useMemo(() => getChatBackground(chatBgId), [chatBgId]);
            const bgStyle = useMemo(() => applyChatBackgroundStyle(chatBg), [chatBg]);

            const builtinFiltered = useMemo(() => searchBuiltinMemes(memeSearch), [memeSearch]);

            const bgFiltered = useMemo(() => {
                if (bgFilter === 'color') return CHAT_BACKGROUNDS.filter(b => b.type === 'color');
                if (bgFilter === 'gradient') return CHAT_BACKGROUNDS.filter(b => b.type === 'gradient');
                if (bgFilter === 'image') return CHAT_BACKGROUNDS.filter(b => b.type === 'image');
                return CHAT_BACKGROUNDS;
            }, [bgFilter]);

            useEffect(() => {
                window.BlissiamTheme?.loadAndApplyTheme();
                if (!roomId) { window.location.href = 'index.html'; return; }
                init();
            }, []);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, partnerTyping]);

            // Crisis detection: สแกนข้อความล่าสุด ถ้าพบสัญญาณเสี่ยง เสนอการ์ดสายด่วน
            // ทำงานฝั่ง client ล้วน ไม่ส่งข้อมูลไปไหน — เป็นการ "ยื่นมือช่วย" ไม่ใช่บล็อก
            useEffect(() => {
                if (crisisDismissed || !messages.length) return;
                const recent = messages.slice(-6);
                if (recent.some(m => !m.is_system && !isMemeMessage(m) && isRiskyText(m.content))) {
                    setShowCrisis(true);
                    setHeavySession(true);
                }
            }, [messages, crisisDismissed]);

            // Heartbeat: อัปเดต last_seen ทุก 25 วิ ให้ระบบรู้ว่าเรายังอยู่ในห้องจริง
            // (queue.html ใช้ค่านี้ตรวจว่าคู่สนทนายังออนไลน์ไหม กันการโยนคนเข้าห้องร้าง)
            useEffect(() => {
                if (!user) return;
                const beat = () => supabase.from('profiles')
                    .update({ status: 'in_chat', last_seen: new Date().toISOString() })
                    .eq('id', user.id);
                beat();
                const iv = setInterval(beat, 25000);
                return () => clearInterval(iv);
            }, [user]);

            // together-timer: อัปเดตเวลาทุก 20 วิ สำหรับ "อยู่ด้วยกันมา X นาที"
            useEffect(() => {
                const iv = setInterval(() => setNowTs(Date.now()), 20000);
                return () => clearInterval(iv);
            }, []);

            // นับถอยหลัง cooldown ปุ่มส่งไออุ่น
            useEffect(() => {
                if (warmthCooldown <= 0) return;
                const t = setInterval(() => setWarmthCooldown(c => Math.max(0, c - 1)), 1000);
                return () => clearInterval(t);
            }, [warmthCooldown > 0]);

            useEffect(() => {
                if (showMediaMenu && mediaTab === 'giphy' && giphyMemes.length === 0 && GIPHY_KEY) fetchGiphy();
            }, [showMediaMenu, mediaTab]);

            function selectBackground(id) {
                setChatBgId(id);
                saveChatBackgroundId(id);
            }

            async function fetchGiphy(query = '') {
                if (!GIPHY_KEY) { setGiphyError('ตั้งค่า GIPHY_API_KEY ใน config.js (ไม่บังคับ — ใช้มีมในตัวได้)'); return; }
                setGiphyLoading(true); setGiphyError(null);
                const endpoint = query
                    ? `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(query)}&limit=12&rating=g`
                    : `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_KEY}&limit=12&rating=g`;
                try {
                    const res = await fetch(endpoint);
                    const json = await res.json();
                    if (json.data?.length) {
                        setGiphyMemes(json.data.map(g => ({ url: g.images.fixed_height.url, title: g.title })));
                    } else {
                        setGiphyMemes([]);
                        if (json.meta?.status !== 200) setGiphyError(json.meta?.msg || 'โหลด Giphy ไม่ได้ — ใช้แท็บมีมในตัวแทน');
                    }
                } catch (e) {
                    setGiphyError('เชื่อมต่อ Giphy ไม่ได้ — ใช้มีมในตัวได้เลย');
                } finally { setGiphyLoading(false); }
            }

            async function init() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) { window.location.href = 'login.html'; return; }
                    setUser(session.user);

                    const { data: profileData } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
                    setProfile(profileData);

                    const { data: roomData } = await supabase.from('rooms').select('*').eq('id', roomId).single();
                    if (!roomData || roomData.status === 'closed') { window.location.href = 'index.html'; return; }
                    setRoom(roomData);

                    const partnerId = roomData.venter_id === session.user.id ? roomData.listener_id : roomData.venter_id;
                    const { data: partnerData } = await supabase.from('public_profiles').select('*').eq('id', partnerId).single();
                    setPartner(partnerData);

                    if (roomData.identity_mode === 'revealed') {
                        const { data: identityRows } = await supabase.rpc('get_partner_identity', { room_id: roomId, partner_id: partnerId });
                        if (identityRows?.length) setPartnerIdentity(identityRows[0]);
                    }

                    const { data: msgData } = await supabase.from('messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
                    setMessages(msgData || []);

                    // โหลด reactions ของข้อความในห้องนี้
                    const msgIds = (msgData || []).map(m => m.id);
                    if (msgIds.length) {
                        const { data: reactData } = await supabase.from('message_reactions').select('message_id, user_id, emoji').in('message_id', msgIds);
                        setReactions(reactData || []);
                    }

                    const { data: kudosRow } = await supabase.from('room_kudos').select('giver_id').eq('room_id', roomId).eq('giver_id', session.user.id).maybeSingle();
                    if (kudosRow) setKudosGiven(true);

                    await supabase.from('profiles').update({ status: 'in_chat', last_seen: new Date().toISOString() }).eq('id', session.user.id);

                    supabase.channel('messages-' + roomId)
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + roomId }, (payload) => {
                            setMessages(prev => prev.some(m => m.id === payload.new.id) ? prev : [...prev, payload.new]);
                            if (payload.new.sender_id !== session.user.id) {
                                setPartnerTyping(false);
                                if (localStorage.getItem('blissiam_sound') !== 'off' && !payload.new.is_system) playMessageSound();
                            }
                        })
                        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room_id=eq.' + roomId }, (payload) => {
                            setMessages(prev => prev.filter(m => m.id !== payload.old.id));
                        })
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reactions' }, (payload) => {
                            const r = payload.new;
                            setReactions(prev => prev.some(x => x.message_id === r.message_id && x.user_id === r.user_id && x.emoji === r.emoji) ? prev : [...prev, { message_id: r.message_id, user_id: r.user_id, emoji: r.emoji }]);
                        })
                        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'message_reactions' }, (payload) => {
                            const r = payload.old;
                            setReactions(prev => prev.filter(x => !(x.message_id === r.message_id && x.user_id === r.user_id && x.emoji === r.emoji)));
                        }).subscribe();

                    supabase.channel('typing-' + roomId)
                        .on('broadcast', { event: 'typing' }, (payload) => {
                            if (payload.payload.senderId !== session.user.id) {
                                setPartnerTyping(true);
                                setTimeout(() => setPartnerTyping(false), 3000);
                            }
                        })
                        .on('broadcast', { event: 'presence-ping' }, (payload) => {
                            // ได้รับ "ไออุ่น" จากคู่สนทนา (โหมดเงียบ — สื่อสารโดยไม่ต้องพิมพ์)
                            if (payload.payload.senderId !== session.user.id) {
                                setWarmthToast(true);
                                if (localStorage.getItem('blissiam_sound') !== 'off') playMessageSound();
                                setTimeout(() => setWarmthToast(false), 2600);
                            }
                        })
                        .subscribe();
                } catch (err) { alert(err.message); }
            }

            // ส่ง "ไออุ่น" ให้คู่สนทนา (โหมดเงียบ/อยู่เป็นเพื่อน)
            function sendWarmth() {
                if (warmthCooldown > 0 || !user) return;
                supabase.channel('typing-' + roomId).send({
                    type: 'broadcast', event: 'presence-ping', payload: { senderId: user.id }
                });
                setWarmthCooldown(6);
            }

            async function sendMessage(content, type = 'text') {
                const body = type === 'text' ? content.trim() : content;
                if (!body || !user) return;
                if (type === 'text') setInput('');
                if (type === 'meme') { setSendingMeme(true); setShowMediaMenu(false); }

                const memeBody = type === 'meme' ? wrapMemeContent(body) : body;
                let payload = { room_id: roomId, sender_id: user.id, content: type === 'meme' ? body : body, message_type: type };

                let { error } = await supabase.from('messages').insert(payload);
                if (error && type === 'meme') {
                    ({ error } = await supabase.from('messages').insert({
                        room_id: roomId, sender_id: user.id, content: memeBody
                    }));
                }
                if (error && type === 'meme') {
                    ({ error } = await supabase.from('messages').insert({
                        room_id: roomId, sender_id: user.id, content: memeBody, message_type: 'text'
                    }));
                }
                if (error) {
                    alert('ส่งไม่สำเร็จ: ' + error.message + '\n\nถ้าเป็นข้อความมีม ให้รัน SQL เพิ่มคอลัมน์ message_type ใน Supabase');
                    if (type === 'text') setInput(content);
                }
                // Auto-flag: ถ้าข้อความของเราเข้าข่ายสัญญาณเสี่ยง แจ้งเข้าคิว admin เงียบๆ (นอกจากการ์ดสายด่วนที่แสดงอยู่แล้ว)
                if (!error && type === 'text' && _safety.category) {
                    const cat = _safety.category(body);
                    if (cat) {
                        try { await supabase.from('safety_flags').insert({
                            user_id: user.id, room_id: roomId, context: 'chat',
                            category: cat, excerpt: body.slice(0, 140)
                        }); } catch (e) {}
                    }
                }
                setSendingMeme(false);
            }

            async function giveKudos() {
                if (!partner || kudosGiven) return;
                const partnerId = room.venter_id === user.id ? room.listener_id : room.venter_id;
                const { error } = await supabase.rpc('give_kudos', { target_user_id: partnerId, room_id_param: roomId });
                if (error) {
                    if (error.message.includes('ให้แต้มในห้องนี้แล้ว')) { setKudosGiven(true); return; }
                    alert('ให้แต้มไม่สำเร็จ: ' + error.message); return;
                }
                setKudosGiven(true);
                setPartner(prev => prev ? { ...prev, kudos_count: (prev.kudos_count || 0) + 1 } : prev);
            }

            async function deleteMessage(msgId) {
                if (!confirm('ลบข้อความนี้?')) return;
                setDeletingId(msgId);
                const { error } = await supabase.from('messages').delete().eq('id', msgId).eq('sender_id', user.id);
                if (error) alert('ลบไม่สำเร็จ: ' + error.message);
                else setMessages(prev => prev.filter(m => m.id !== msgId));
                setDeletingId(null);
            }

            // สลับ reaction ของเราบนข้อความ (มีอยู่แล้ว = เอาออก, ไม่มี = ใส่)
            async function toggleReaction(msgId, emoji) {
                setReactBarFor(null);
                if (!user) return;
                const mine = reactions.some(r => r.message_id === msgId && r.user_id === user.id && r.emoji === emoji);
                if (mine) {
                    setReactions(prev => prev.filter(r => !(r.message_id === msgId && r.user_id === user.id && r.emoji === emoji)));
                    await supabase.from('message_reactions').delete().eq('message_id', msgId).eq('user_id', user.id).eq('emoji', emoji);
                } else {
                    setReactions(prev => [...prev, { message_id: msgId, user_id: user.id, emoji }]);
                    await supabase.from('message_reactions').insert({ message_id: msgId, user_id: user.id, emoji });
                }
            }

            function toggleSound() {
                const next = !soundEnabled;
                setSoundEnabled(next);
                localStorage.setItem('blissiam_sound', next ? 'on' : 'off');
            }

            async function submitReport() {
                if (!partner || !user) return;
                const partnerId = room.venter_id === user.id ? room.listener_id : room.venter_id;
                const { error } = await supabase.from('reports').insert({
                    reporter_id: user.id, reported_user_id: partnerId, room_id: roomId,
                    reason: reportReason, details: reportDetails.trim() || null
                });
                if (error) { alert('ส่งรายงานไม่สำเร็จ: ' + error.message); return; }
                setShowReportModal(false); setReportDetails('');
                alert('ส่งรายงานแล้ว ทีมงานจะตรวจสอบโดยเร็วที่สุด');
            }

            // ส่งต่ออย่างอบอุ่น — พาคู่สนทนาไปหาความช่วยเหลือที่เหมาะสม (ผู้รับฟังเป็นคนกด)
            const HANDOFF_MESSAGE = 'เราฟังเธออยู่นะ และเป็นห่วงมากจริงๆ 🤍 เรื่องที่เธอเจอหนักมาก และเราอยากให้เธอได้รับการดูแลที่ดีที่สุด อยากชวนให้ลองคุยกับผู้เชี่ยวชาญที่พร้อมช่วยตลอด 24 ชม.\n\n• สายด่วนสุขภาพจิต 1323 (ฟรี)\n• สมาคมสะมาริตันส์ 02-113-6789\n\nเธอไม่ได้อยู่คนเดียวเลยนะ เรายังอยู่ตรงนี้ด้วย';
            async function sendWarmHandoff() {
                setShowHandoff(false);
                await sendMessage(HANDOFF_MESSAGE, 'text');
                try {
                    await supabase.from('safety_flags').insert({
                        user_id: user.id, room_id: roomId, context: 'chat',
                        category: 'ส่งต่ออย่างอบอุ่น (ผู้รับฟังขอความช่วยเหลือ)', excerpt: 'ผู้รับฟังใช้ warm handoff ในห้องนี้'
                    });
                } catch (e) {}
            }

            // #2 บล็อกผู้ใช้นี้ (ไม่ถูกจับคู่ซ้ำ) แล้วจบแชท
            async function blockPartner() {
                if (!partner || !user) return;
                if (!confirm('บล็อกคู่สนทนานี้? จะไม่ถูกจับคู่กันอีก และบทสนทนานี้จะจบลง')) return;
                const partnerId = room.venter_id === user.id ? room.listener_id : room.venter_id;
                try { await supabase.from('blocks').insert({ blocker_id: user.id, blocked_id: partnerId }); } catch (e) {}
                triggerEndChat();
            }

            // #10 ให้คะแนนการพูดคุย (เก็บลง ratings)
            async function submitRating(stars) {
                setRatingGiven(stars);
                if (!partner || !user) return;
                const partnerId = room.venter_id === user.id ? room.listener_id : room.venter_id;
                try { await supabase.from('ratings').insert({ room_id: roomId, rater_id: user.id, rated_id: partnerId, stars }); } catch (e) {}
            }

            // Reconnect: บันทึกคู่คุยนี้ไว้ (ถ้าอีกฝ่ายก็บันทึก จะกลับมาชวนคุยกันใหม่ได้)
            async function toggleSavePartner() {
                if (!partner || !user) return;
                const partnerId = room.venter_id === user.id ? room.listener_id : room.venter_id;
                if (savedPartner) {
                    setSavedPartner(false);
                    try { await supabase.from('saved_partners').delete().eq('user_id', user.id).eq('partner_id', partnerId); } catch (e) {}
                } else {
                    setSavedPartner(true);
                    try { await supabase.from('saved_partners').insert({ user_id: user.id, partner_id: partnerId, room_id: roomId }); } catch (e) {}
                }
            }

            async function triggerEndChat() {
                await supabase.from('rooms').update({ status: 'closed', ended_at: new Date().toISOString(), ended_by: user.id }).eq('id', roomId);
                await supabase.from('profiles').update({ status: 'offline' }).eq('id', user.id);
                window.location.href = 'index.html';
            }

            // เปิดพิธีกรรมปิดจบ (รีเซ็ตสเต็ป)
            function openFarewell() {
                setEndStep('ask'); setAfterMood(null); setShowMediaMenu(false); setShowEndConfirm(true);
            }
            // เลือก mood หลังคุย -> ไปสเต็ปอำลา (ค่อย commit ตอนจบจริง เผื่อจดบันทึกด้วย)
            function chooseAfterMood(score) {
                setAfterMood(score);
                setEndStep('farewell');
            }
            // ปิดจบจริง: บันทึก mood + reflection note ลง "เส้นทางใจ" แล้วออกจากห้อง
            function finalizeAndEnd() {
                try {
                    if (afterMood != null || (reflectNote || '').trim()) {
                        NomGIMood.commitAfter(afterMood, reflectNote);
                    }
                } catch (e) {}
                triggerEndChat();
            }

            const partnerName = partnerIdentity?.real_name || partner?.display_name || 'คู่สนทนา';
            const partnerSub = partnerIdentity?.school || 'พื้นที่ปลอดภัย · สนทนาส่วนตัว';

            // "อยู่ด้วยกันมา X นาที" จาก room.created_at (โหมดเงียบ #1)
            const togetherLabel = (() => {
                if (!room?.created_at) return '';
                const mins = Math.max(0, Math.floor((nowTs - new Date(room.created_at).getTime()) / 60000));
                if (mins < 1) return 'เพิ่งเริ่มอยู่ด้วยกัน';
                if (mins < 60) return `อยู่ด้วยกันมา ${mins} นาที`;
                const h = Math.floor(mins / 60), m = mins % 60;
                return `อยู่ด้วยกันมา ${h} ชม.${m ? ' ' + m + ' นาที' : ''}`;
            })();

            if (!room || !profile) return (
                <div class="h-full flex flex-col items-center justify-center gap-4" style={bgStyle}>
                    <div class="w-12 h-12 rounded-2xl bg-white/80 shadow-chat flex items-center justify-center">
                        <div class="w-6 h-6 border-2 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <p class="text-sm text-ink-500">กำลังเตรียมห้องสนทนา...</p>
                </div>
            );

            return (
                <div class="h-full flex flex-col relative" style={bgStyle}>
                    {/* Header */}
                    <header class="glass border-b border-line px-4 py-3 flex items-center justify-between z-20 shrink-0">
                        <button type="button" onClick={() => setShowProfileModal(true)} class="flex items-center gap-3 text-left group min-w-0">
                            <div class="relative shrink-0 wiggle-hover">
                                <div class="w-11 h-11 rounded-2xl bg-white shadow-bubble bg-cover bg-center flex items-center justify-center font-semibold text-primary-600 border border-white"
                                    style={partner?.avatar_url ? { backgroundImage: `url(${partner.avatar_url})` } : {}}>
                                    {!partner?.avatar_url && partnerName.charAt(0)}
                                </div>
                                <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-400 border-2 border-white rounded-full"></span>
                            </div>
                            <div class="min-w-0">
                                <div class="font-semibold text-ink-900 truncate group-hover:text-primary-600 transition">{partnerName}</div>
                                {partnerTyping ? (
                                    <div class="flex items-center gap-1 text-xs font-medium text-primary-600">
                                        <span>กำลังพิมพ์</span>
                                        <span class="flex gap-0.5">
                                            <span class="typing-dot w-1 h-1 bg-primary-500 rounded-full"></span>
                                            <span class="typing-dot w-1 h-1 bg-primary-500 rounded-full"></span>
                                            <span class="typing-dot w-1 h-1 bg-primary-500 rounded-full"></span>
                                        </span>
                                    </div>
                                ) : (
                                    <div class="text-xs text-ink-400 truncate flex items-center gap-1">
                                        <span class="text-primary-500">🕊️</span>{togetherLabel || partnerSub}
                                    </div>
                                )}
                            </div>
                        </button>
                        <div class="flex items-center gap-1 shrink-0">
                            <IconBtn onClick={sendWarmth} active={warmthCooldown === 0} title="ส่งไออุ่นให้คู่สนทนา (ไม่ต้องพิมพ์)">
                                <span class={warmthCooldown === 0 ? '' : 'opacity-40'} style={{ fontSize: '18px' }}>🫂</span>
                            </IconBtn>
                            <DarkModeToggle isDark={isDark} onToggle={toggleDarkMode} />
                            <IconBtn onClick={() => { setShowBgPicker(true); setShowMediaMenu(false); }} title="เปลี่ยนพื้นหลัง">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </IconBtn>
                            <IconBtn onClick={toggleSound} title={soundEnabled ? 'ปิดเสียง' : 'เปิดเสียง'} active={soundEnabled}>
                                {soundEnabled ? (
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15.536 8.464a5 5 0 010 7.072M12 6v12m-6-6h4l4-4v16l-4-4H6"/></svg>
                                ) : (
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
                                )}
                            </IconBtn>
                            {room.listener_id === user.id && (
                                <IconBtn onClick={() => setShowHandoff(true)} title="ส่งต่ออย่างอบอุ่น">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
                                </IconBtn>
                            )}
                            <IconBtn onClick={() => setShowReportModal(true)} title="รายงาน">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
                            </IconBtn>
                            <button type="button" onClick={openFarewell}
                                class="ml-1 px-4 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition">
                                จบแชท
                            </button>
                        </div>
                    </header>

                    {/* แถบบอกความต้องการของคู่สนทนา (#2) — โชว์เมื่อมีข้อมูล */}
                    {room.support_type && SUPPORT_LABELS[room.support_type] && (
                        <div class="shrink-0 flex justify-center py-1.5 glass border-b border-line/60 z-10">
                            <span class="text-xs text-ink-500 flex items-center gap-1.5">
                                <span>{SUPPORT_LABELS[room.support_type].emoji}</span>
                                วันนี้เขา{SUPPORT_LABELS[room.support_type].label}
                            </span>
                        </div>
                    )}

                    {/* ได้รับไออุ่นจากคู่สนทนา (โหมดเงียบ) */}
                    {warmthToast && (
                        <div class="absolute top-20 left-1/2 -translate-x-1/2 z-30 toast-in pointer-events-none">
                            <div class="glass shadow-float border border-white/60 rounded-full px-5 py-2.5 flex items-center gap-2">
                                <span class="text-2xl heart-beat">🫂</span>
                                <span class="text-sm font-medium text-ink-700">คู่สนทนาส่งไออุ่นถึงคุณ</span>
                            </div>
                        </div>
                    )}

                    {/* Messages */}
                    <div class="flex-1 overflow-y-auto px-4 py-5 scrollbar-hide" onClick={() => { setShowMediaMenu(false); }}>
                        {messages.length === 0 && (
                            <div class="flex flex-col items-center justify-center py-16 text-center">
                                <div class="w-16 h-16 rounded-3xl glass shadow-chat flex items-center justify-center text-3xl mb-4">💬</div>
                                <p class="text-sm font-medium text-ink-700">เริ่มพูดคุยได้เลย</p>
                                <p class="text-xs text-ink-400 mt-1">พื้นที่นี้ปลอดภัยและเป็นส่วนตัว</p>
                            </div>
                        )}
                        {messages.map((msg, idx) => {
                            const prevMsg = messages[idx - 1];
                            const showDateDivider = !prevMsg || new Date(prevMsg.created_at).toDateString() !== new Date(msg.created_at).toDateString();

                            if (msg.is_system) return (
                                <React.Fragment key={msg.id}>
                                    {showDateDivider && (
                                        <div class="flex justify-center my-4">
                                            <span class="text-[10px] font-medium text-ink-400 bg-black/5 px-3 py-1 rounded-full tracking-wide">{formatDayLabel(msg.created_at)}</span>
                                        </div>
                                    )}
                                    <div class="flex justify-center my-4">
                                        <span class="text-xs text-ink-400 bg-white/60 px-3 py-1 rounded-full">{msg.content}</span>
                                    </div>
                                </React.Fragment>
                            );
                            const isMine = msg.sender_id === user.id;
                            const avatar = isMine ? profile?.avatar_url : partner?.avatar_url;
                            const initial = isMine ? profile?.display_name?.charAt(0) : partner?.display_name?.charAt(0);
                            const meme = isMemeMessage(msg);

                            return (
                                <React.Fragment key={msg.id}>
                                    {showDateDivider && (
                                        <div class="flex justify-center my-4">
                                            <span class="text-[10px] font-medium text-ink-400 bg-black/5 px-3 py-1 rounded-full tracking-wide">{formatDayLabel(msg.created_at)}</span>
                                        </div>
                                    )}
                                    <div class={`msg-in flex gap-2.5 mb-3 ${isMine ? 'flex-row-reverse' : ''}`}>
                                        <div class="w-8 h-8 rounded-xl shrink-0 bg-white/80 shadow-bubble bg-cover bg-center flex items-center justify-center text-xs font-medium text-primary-600 mt-auto ring-1 ring-black/5"
                                            style={avatar ? { backgroundImage: `url(${avatar})` } : {}}>
                                            {!avatar && initial}
                                        </div>
                                        <div class={`group max-w-[78%] flex flex-col ${isMine ? 'items-end' : 'items-start'}`}>
                                            {isMine && (
                                                <button type="button" onClick={() => deleteMessage(msg.id)} disabled={deletingId === msg.id}
                                                    class="opacity-0 group-hover:opacity-100 text-[10px] text-red-400 hover:text-red-600 mb-1 transition">
                                                    {deletingId === msg.id ? 'กำลังลบ...' : 'ลบ'}
                                                </button>
                                            )}
                                            {meme ? (
                                                <div class="rounded-2xl overflow-hidden shadow-chat border border-white/80 bg-white/40">
                                                    <img src={getMemeUrl(msg)} alt="meme" class="max-w-[220px] max-h-[200px] object-cover block" loading="lazy"
                                                        onError={(e) => { e.target.src = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22120%22><rect fill=%22%23f0f0f0%22 width=%22200%22 height=%22120%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2214%22>โหลดรูปไม่ได้</text></svg>'; }} />
                                                </div>
                                            ) : (
                                                <div class={`px-4 py-2.5 rounded-2xl shadow-bubble text-[15px] leading-relaxed transition-transform ${isMine
                                                    ? 'bg-gradient-to-br from-primary-500 to-primary-600 text-white rounded-br-md'
                                                    : 'glass text-ink-900 rounded-bl-md border border-white/60'}`}>
                                                    <span class="whitespace-pre-wrap break-words">{msg.content}</span>
                                                </div>
                                            )}
                                            {(() => {
                                                const rs = reactions.filter(r => r.message_id === msg.id);
                                                const groups = {};
                                                rs.forEach(r => { groups[r.emoji] = groups[r.emoji] || { count: 0, mine: false }; groups[r.emoji].count++; if (r.user_id === user.id) groups[r.emoji].mine = true; });
                                                const entries = Object.entries(groups);
                                                return (
                                                    <div class={`flex items-center gap-1 mt-1 flex-wrap ${isMine ? 'flex-row-reverse' : ''}`}>
                                                        {entries.map(([em, g]) => (
                                                            <button key={em} type="button" onClick={() => toggleReaction(msg.id, em)}
                                                                class={`text-xs px-1.5 py-0.5 rounded-full border transition ${g.mine ? 'bg-primary-50 border-primary-300 text-primary-700' : 'bg-surface border-line text-ink-500'}`}>
                                                                {em}{g.count > 1 ? ' ' + g.count : ''}
                                                            </button>
                                                        ))}
                                                        {/* มือถือไม่มี hover — ให้ปุ่ม react มองเห็นจางๆ เสมอ, เดสก์ท็อปค่อยโผล่ตอน hover */}
                                                        <button type="button" onClick={() => setReactBarFor(reactBarFor === msg.id ? null : msg.id)}
                                                            aria-label="เพิ่มรีแอคชัน"
                                                            class="opacity-60 sm:opacity-0 sm:group-hover:opacity-100 text-xs text-ink-400 hover:text-primary-600 px-1.5 py-0.5 transition">＋😊</button>
                                                        <span class="text-[10px] text-ink-400 px-1">{formatTime(msg.created_at)}</span>
                                                    </div>
                                                );
                                            })()}
                                            {reactBarFor === msg.id && (
                                                <div class={`flex gap-1.5 mt-1 bg-surface border border-line rounded-full px-2.5 py-1.5 shadow-float ${isMine ? 'self-end' : 'self-start'}`}>
                                                    {QUICK_REACTIONS.map(em => (
                                                        <button key={em} type="button" onClick={() => toggleReaction(msg.id, em)} class="text-lg hover:scale-125 transition active:scale-95">{em}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </React.Fragment>
                            );
                        })}
                        <div ref={messagesEndRef} class="h-2" />
                    </div>

                    {/* Media picker */}
                    {showMediaMenu && (
                        <div class="absolute inset-x-0 bottom-[80px] sm:bottom-[88px] z-30 px-3 sm:px-4 max-h-[70vh] flex flex-col justify-end">
                            <div class="glass-dark rounded-3xl shadow-float border border-white/60 overflow-hidden max-w-lg w-full mx-auto sheet-up">
                                <div class="flex border-b border-line">
                                    {[
                                        { id: 'meme', label: '🎭 มีมในตัว' },
                                        { id: 'giphy', label: '🔍 Giphy' },
                                        { id: 'emoji', label: '😊 อีโมจิ' },
                                    ].map(tab => (
                                        <button key={tab.id} type="button" onClick={() => setMediaTab(tab.id)}
                                            class={`flex-1 py-3 text-xs font-semibold transition ${mediaTab === tab.id ? 'text-primary-600 border-b-2 border-primary-500 bg-primary-50/50' : 'text-ink-400 hover:text-ink-700'}`}>
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>
                                <div class="p-4 max-h-[45vh] sm:max-h-[280px] overflow-y-auto scrollbar-hide">
                                    {mediaTab === 'emoji' && (
                                        <div class="flex flex-wrap gap-2 justify-center">
                                            {EMOJIS.map(e => (
                                                <button key={e} type="button" onClick={() => setInput(prev => prev + e)}
                                                    class="w-10 h-10 text-xl hover:bg-black/5 rounded-xl transition hover:scale-110">{e}</button>
                                            ))}
                                        </div>
                                    )}
                                    {mediaTab === 'meme' && (
                                        <div>
                                            <input type="text" value={memeSearch} onChange={e => setMemeSearch(e.target.value)}
                                                placeholder="ค้นหามีม..." class="w-full mb-3 text-sm bg-white/70 border border-line rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500/30" />
                                            <div class="grid grid-cols-4 gap-2">
                                                {builtinFiltered.map(m => (
                                                    <button key={m.id} type="button" disabled={sendingMeme} onClick={() => sendMessage(m.url, 'meme')}
                                                        class="relative aspect-square rounded-xl overflow-hidden border border-white/80 shadow-bubble hover:scale-105 transition disabled:opacity-50 group"
                                                        title={m.label}>
                                                        <img src={m.url} alt={m.label} class="w-full h-full object-cover" loading="lazy" />
                                                        <span class="absolute inset-x-0 bottom-0 bg-black/50 text-white text-[9px] py-0.5 opacity-0 group-hover:opacity-100 transition">{m.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <p class="text-[10px] text-ink-400 text-center mt-3">มีมในตัว {BUILTIN_MEMES.length} รายการ · ส่งได้ทันทีไม่ต้องรอ API</p>
                                        </div>
                                    )}
                                    {mediaTab === 'giphy' && (
                                        <div>
                                            <form onSubmit={(e) => { e.preventDefault(); fetchGiphy(memeSearch); }} class="flex gap-2 mb-3">
                                                <input type="text" value={memeSearch} onChange={e => setMemeSearch(e.target.value)} placeholder="ค้นหา Giphy..."
                                                    class="flex-1 text-sm bg-white/70 border border-line rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500/30" />
                                                <button type="submit" class="px-4 py-2 bg-primary-500 text-white text-sm rounded-xl font-medium">ค้นหา</button>
                                            </form>
                                            {giphyLoading && <p class="text-xs text-center text-ink-400 py-6">กำลังโหลด...</p>}
                                            {giphyError && <p class="text-xs text-center text-amber-600 py-2">{giphyError}</p>}
                                            <div class="grid grid-cols-3 gap-2">
                                                {giphyMemes.map((m, i) => (
                                                    <button key={i} type="button" disabled={sendingMeme} onClick={() => sendMessage(m.url, 'meme')}
                                                        class="aspect-square rounded-xl overflow-hidden border border-white/80 hover:scale-105 transition disabled:opacity-50">
                                                        <img src={m.url} alt="" class="w-full h-full object-cover" loading="lazy" />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Input bar */}
                    <div class="shrink-0 z-20 px-4 pb-4 pt-2">
                        <form onSubmit={(e) => { e.preventDefault(); sendMessage(input, 'text'); }}
                            class="glass-dark rounded-2xl shadow-float border border-white/70 p-2 flex gap-2 items-center max-w-2xl mx-auto focus-within:ring-2 focus-within:ring-primary-500/25 transition-shadow">
                            <button type="button" onClick={() => { setShowMediaMenu(!showMediaMenu); setShowBgPicker(false); setShowHelper(false); }}
                                class={`w-11 h-11 rounded-xl flex items-center justify-center text-xl transition-all duration-200 active:scale-90 ${showMediaMenu ? 'bg-primary-50 text-primary-600 rotate-45' : 'hover:bg-black/5'}`}>
                                ＋
                            </button>
                            <button type="button" onClick={() => { setShowHelper(!showHelper); setShowMediaMenu(false); }} title="ตัวช่วยเริ่มคุย / กำลังใจ"
                                class={`w-11 h-11 rounded-xl flex items-center justify-center text-lg transition-all duration-200 active:scale-90 shrink-0 ${showHelper ? 'bg-primary-50 text-primary-600' : 'hover:bg-black/5'}`}>
                                💡
                            </button>
                            <input type="text" value={input}
                                onChange={(e) => {
                                    setInput(e.target.value);
                                    supabase.channel('typing-' + roomId).send({ type: 'broadcast', event: 'typing', payload: { senderId: user.id } });
                                }}
                                placeholder="พิมพ์ข้อความ..."
                                class="flex-1 bg-transparent text-base focus:outline-none placeholder:text-ink-400 min-w-0" />
                            <button type="submit" disabled={!input.trim()}
                                class="w-11 h-11 rounded-xl bg-primary-500 text-white flex items-center justify-center shrink-0 disabled:opacity-40 hover:bg-primary-600 active:scale-90 transition-all duration-150 shadow-bubble">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                            </button>
                        </form>
                    </div>

                    {/* Background picker */}
                    {showBgPicker && (
                        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center" onClick={() => setShowBgPicker(false)}>
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
                            <div class="relative w-full sm:max-w-lg max-h-[85vh] glass rounded-t-3xl sm:rounded-3xl shadow-float sheet-up flex flex-col" onClick={e => e.stopPropagation()}>
                                <div class="p-5 border-b border-line shrink-0">
                                    <div class="w-10 h-1 bg-ink-200 rounded-full mx-auto mb-4 sm:hidden"></div>
                                    <h3 class="text-lg font-bold text-ink-900">พื้นหลังแชท</h3>
                                    <p class="text-xs text-ink-400 mt-0.5">{CHAT_BACKGROUNDS.length} แบบให้เลือก · บันทึกในเครื่องของคุณ</p>
                                    <div class="flex gap-2 mt-3 flex-wrap">
                                        {[
                                            { id: 'all', label: 'ทั้งหมด' },
                                            { id: 'color', label: 'สี' },
                                            { id: 'gradient', label: 'ไล่สี' },
                                            { id: 'image', label: 'ภาพ' },
                                        ].map(f => (
                                            <button key={f.id} type="button" onClick={() => setBgFilter(f.id)}
                                                class={`px-3 py-1 rounded-full text-xs font-medium transition ${bgFilter === f.id ? 'bg-ink-900 text-white' : 'bg-white/60 text-ink-600 hover:bg-white'}`}>
                                                {f.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div class="p-4 overflow-y-auto scrollbar-hide grid grid-cols-4 gap-2.5">
                                    {bgFiltered.map(bg => (
                                        <button key={bg.id} type="button" onClick={() => selectBackground(bg.id)}
                                            class={`relative aspect-square rounded-2xl overflow-hidden border-2 transition hover:scale-105 ${chatBgId === bg.id ? 'border-primary-500 ring-2 ring-primary-500/30' : 'border-white/80'}`}
                                            style={getChatBackgroundThumbStyle(bg)} title={bg.label}>
                                            {chatBgId === bg.id && (
                                                <span class="absolute inset-0 flex items-center justify-center bg-black/20">
                                                    <svg class="w-6 h-6 text-white drop-shadow" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                                                </span>
                                            )}
                                            <span class="absolute bottom-0 inset-x-0 bg-black/45 text-white text-[8px] py-0.5 truncate px-1">{bg.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Profile modal */}
                    {showProfileModal && partner && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowProfileModal(false)}>
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
                            <div class="relative bg-white rounded-3xl p-8 max-w-sm w-full shadow-float border border-line" onClick={e => e.stopPropagation()}>
                                <button type="button" onClick={() => setShowProfileModal(false)} class="absolute top-4 right-4 w-8 h-8 rounded-full hover:bg-paper-100 flex items-center justify-center text-ink-400">✕</button>
                                <div class="w-24 h-24 mx-auto rounded-3xl bg-cover bg-center mb-4 flex items-center justify-center text-4xl font-bold bg-primary-50 text-primary-600 shadow-chat"
                                    style={partner.avatar_url ? { backgroundImage: `url(${partner.avatar_url})` } : {}}>
                                    {!partner.avatar_url && partnerName.charAt(0)}
                                </div>
                                <h3 class="text-xl font-bold text-center mb-1">{partnerName}</h3>
                                {partner.ig_username ? (
                                    <a href={`https://instagram.com/${partner.ig_username}`} target="_blank" rel="noopener"
                                        class="flex items-center justify-center gap-1 text-pink-600 text-sm font-medium mb-4 hover:underline">@{partner.ig_username}</a>
                                ) : (
                                    <p class="text-sm text-ink-400 text-center mb-4">{partnerSub}</p>
                                )}
                                {(isTrustedListener(partner) || isTrained(partner)) && (
                                    <div class="flex flex-wrap justify-center gap-1.5 mb-4 -mt-1">
                                        {isTrained(partner) && (
                                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-50 text-primary-700 text-xs font-semibold border border-primary-200">
                                                ✅ ผ่านการอบรม
                                            </span>
                                        )}
                                        {isTrustedListener(partner) && (
                                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold border border-amber-200">
                                                🌟 ผู้ฟังที่ไว้ใจได้ · {Number(partner.rating_avg).toFixed(1)} ({partner.rating_count})
                                            </span>
                                        )}
                                    </div>
                                )}
                                <div class="bg-primary-50 border border-primary-100 rounded-2xl p-4">
                                    <div class="flex items-center gap-3">
                                        <div class="shrink-0 w-16 h-16" dangerouslySetInnerHTML={{ __html: kudosPlantSvg(partner.kudos_count || 0, 64) }}></div>
                                        <div class="min-w-0 flex-1">
                                            <div class="text-sm font-bold text-primary-700">ต้นไม้น้ำใจ</div>
                                            <div class="text-xs text-primary-600">{kudosStage(partner.kudos_count || 0).label} · น้ำใจ {partner.kudos_count || 0}</div>
                                        </div>
                                        <button type="button" onClick={giveKudos} disabled={kudosGiven}
                                            class={`px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0 ${kudosGiven ? 'bg-paper-100 text-ink-400' : 'bg-primary-500 text-white hover:bg-primary-600'}`}>
                                            {kudosGiven ? 'รดน้ำแล้ว ✓' : 'รดน้ำ 💧'}
                                        </button>
                                    </div>
                                </div>
                                {Array.isArray(partner.specialties) && partner.specialties.length > 0 && (
                                    <div class="mt-4">
                                        <div class="text-xs font-semibold text-ink-500 mb-2">ถนัดรับฟังเรื่อง</div>
                                        <div class="flex flex-wrap gap-1.5 justify-center">
                                            {partner.specialties.map(s => (
                                                <span key={s} class="px-2.5 py-1 rounded-full bg-paper-100 text-ink-600 text-xs border border-line">{SPECIALTY_LABEL[s] || s}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Warm handoff modal (ผู้รับฟัง) */}
                    {showHandoff && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowHandoff(false)}>
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
                            <div class="relative bg-surface rounded-3xl p-6 max-w-sm w-full shadow-float border border-line" onClick={e => e.stopPropagation()}>
                                <div class="text-4xl mb-3 text-center">🤍</div>
                                <h3 class="text-lg font-bold text-ink-900 mb-1 text-center">ส่งต่ออย่างอบอุ่น</h3>
                                <p class="text-sm text-ink-500 mb-4 text-center">ถ้ารู้สึกว่าเรื่องนี้เกินกำลังเรา การพาเขาไปหาความช่วยเหลือที่เหมาะสมคือการดูแลที่ดีที่สุด — ไม่ใช่การทิ้งกัน</p>
                                <div class="bg-paper-50 border border-line rounded-2xl p-4 text-sm text-ink-600 whitespace-pre-wrap leading-relaxed mb-4">{HANDOFF_MESSAGE}</div>
                                <button type="button" onClick={sendWarmHandoff}
                                    class="w-full py-3 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white font-semibold text-sm hover:brightness-105 transition mb-2">
                                    ส่งข้อความนี้ให้คู่สนทนา
                                </button>
                                <button type="button" onClick={() => setShowHandoff(false)} class="w-full text-xs text-ink-400 hover:text-ink-600 transition">ยกเลิก</button>
                            </div>
                        </div>
                    )}

                    {/* Report modal */}
                    {showReportModal && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowReportModal(false)}>
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
                            <div class="relative bg-white rounded-3xl p-6 max-w-sm w-full shadow-float" onClick={e => e.stopPropagation()}>
                                <h3 class="text-lg font-bold mb-4">รายงานผู้ใช้</h3>
                                <select value={reportReason} onChange={e => setReportReason(e.target.value)} class="w-full mb-3 text-sm border border-line rounded-xl px-3 py-2.5 bg-paper-50">
                                    {REPORT_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                                </select>
                                <textarea value={reportDetails} onChange={e => setReportDetails(e.target.value)} rows="3" placeholder="รายละเอียด (ไม่บังคับ)"
                                    class="w-full mb-4 text-sm border border-line rounded-xl px-3 py-2.5 bg-paper-50 resize-none" />
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setShowReportModal(false)} class="py-2.5 rounded-xl border text-sm font-medium">ยกเลิก</button>
                                    <button type="button" onClick={submitReport} class="py-2.5 rounded-xl bg-red-500 text-white text-sm font-medium">ส่งรายงาน</button>
                                </div>
                                <button type="button" onClick={blockPartner} class="w-full mt-3 py-2.5 rounded-xl border border-red-200 text-red-600 text-sm font-medium hover:bg-red-50 transition">
                                    🚫 บล็อกและไม่จับคู่ซ้ำ
                                </button>
                            </div>
                        </div>
                    )}

                    {/* #3 คำแนะนำก่อนเริ่มคุย (แสดงครั้งเดียวต่อเครื่อง) */}
                    {showGuidelines && (
                        <div class="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4">
                            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
                            <div class="relative w-full sm:max-w-md bg-surface rounded-3xl shadow-float border border-line overflow-hidden sheet-up">
                                <div class="p-6">
                                    <div class="text-3xl mb-2 text-center">🤝</div>
                                    <h3 class="text-lg font-bold text-ink-900 text-center mb-1">ก่อนเริ่มพูดคุย</h3>
                                    <p class="text-xs text-ink-400 text-center mb-5">พื้นที่นี้คือการรับฟังกันด้วยใจ</p>
                                    <div class="space-y-3 text-sm text-ink-700">
                                        <div class="flex gap-3"><span>💚</span><span>ให้เกียรติและใจดีต่อกัน · ไม่ตัดสิน ไม่กดดัน</span></div>
                                        <div class="flex gap-3"><span>🔒</span><span>เคารพความเป็นส่วนตัว · ไม่บันทึก/เผยแพร่บทสนทนาของอีกฝ่าย</span></div>
                                        <div class="flex gap-3"><span>ℹ️</span><span>ที่นี่คือเพื่อนรับฟัง <b>ไม่ใช่คำปรึกษาจากผู้เชี่ยวชาญ</b> หากอยู่ในภาวะเสี่ยง โปรดโทรสายด่วน 1323</span></div>
                                    </div>
                                    <button type="button" onClick={() => { try { localStorage.setItem('nomgi_guidelines_ok', '1'); } catch(e){} setShowGuidelines(false); }}
                                        class="btn-farewell w-full py-3 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white font-semibold text-sm mt-6 hover:brightness-105 transition">
                                        เข้าใจแล้ว เริ่มพูดคุย
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* #4/#5 ตัวช่วย: ประโยคเปิดบทสนทนา + การ์ดกำลังใจ */}
                    {showHelper && (
                        <div class="absolute inset-x-0 bottom-[80px] sm:bottom-[88px] z-30 px-3 sm:px-4 max-h-[70vh] flex flex-col justify-end" onClick={() => setShowHelper(false)}>
                            <div class="glass-dark rounded-3xl shadow-float border border-white/60 overflow-hidden max-w-lg w-full mx-auto sheet-up" onClick={e => e.stopPropagation()}>
                                <div class="p-4 max-h-[45vh] sm:max-h-[300px] overflow-y-auto scrollbar-hide space-y-4">
                                    <div>
                                        <div class="text-xs font-semibold text-primary-600 mb-2">💬 ประโยคเปิดบทสนทนา</div>
                                        <div class="space-y-1.5">
                                            {ICE_BREAKERS.map((t, i) => (
                                                <button key={i} type="button" onClick={() => { sendMessage(t, 'text'); setShowHelper(false); }}
                                                    class="w-full text-left text-sm bg-surface/70 hover:bg-primary-50 border border-line rounded-xl px-3 py-2.5 transition">{t}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <div class="text-xs font-semibold text-amber-600 mb-2">🫂 การ์ดกำลังใจ (แตะเพื่อส่ง)</div>
                                        <div class="flex flex-wrap gap-1.5">
                                            {ENCOURAGEMENTS.map((t, i) => (
                                                <button key={i} type="button" onClick={() => { sendMessage(t, 'text'); setShowHelper(false); }}
                                                    class="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-full px-3 py-1.5 hover:brightness-95 transition">{t}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Crisis / สายด่วนช่วยเหลือ — ยื่นมือช่วยแบบอ่อนโยน ไม่บล็อกการคุย */}
                    {showCrisis && (
                        <div class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4">
                            <div class="absolute inset-0 bg-black/45 backdrop-blur-sm" onClick={() => { setShowCrisis(false); setCrisisDismissed(true); }}></div>
                            <div class="relative w-full sm:max-w-md bg-surface rounded-3xl shadow-float border border-line overflow-hidden sheet-up">
                                <div class="bg-gradient-to-br from-rose-500 to-red-500 p-5 text-white">
                                    <div class="flex items-center gap-2 text-lg font-bold">🫂 คุณไม่ได้อยู่คนเดียวนะ</div>
                                    <p class="text-sm text-white/90 mt-1 leading-relaxed">ดูเหมือนตอนนี้คุณกำลังเจอเรื่องหนักมากๆ ถ้ารู้สึกไม่ไหว มีคนพร้อมรับฟังและช่วยเหลือคุณจริงๆ</p>
                                </div>
                                <div class="p-5 space-y-2.5">
                                    {HOTLINES.map((h, i) => (
                                        <a key={i} href={h.href}
                                            class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border border-line hover:border-rose-300 hover:bg-rose-50/50 transition group">
                                            <div class="min-w-0">
                                                <div class="text-sm font-semibold text-ink-900 truncate">{h.name}</div>
                                                <div class="text-xs text-ink-400">{h.note}</div>
                                            </div>
                                            <span class="shrink-0 px-3 py-1.5 rounded-full bg-rose-500 text-white text-sm font-bold group-hover:bg-rose-600 transition">{h.phone}</span>
                                        </a>
                                    ))}
