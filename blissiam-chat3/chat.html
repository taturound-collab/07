                                    <button type="button" onClick={() => { setShowCrisis(false); setCrisisDismissed(true); }}
                                        class="w-full text-center text-sm text-ink-500 hover:text-ink-900 transition py-2 mt-1">
                                        ขอบคุณ ฉันโอเค คุยต่อได้
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* พิธีกรรมปิดจบ (3 สเต็ป) */}
                    {showEndConfirm && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => endStep !== 'farewell' && setShowEndConfirm(false)}></div>
                            <div class="relative bg-surface rounded-3xl p-7 max-w-sm w-full shadow-float text-center border border-line">

                                {endStep === 'ask' && (
                                    <>
                                        <div class="text-4xl mb-3">🕯️</div>
                                        <h3 class="text-lg font-bold mb-1 text-ink-900">ก่อนจากกันวันนี้</h3>
                                        <p class="text-sm text-ink-400 mb-5">ขอบคุณที่เปิดใจให้กัน · อยากส่งน้ำใจให้คู่สนทนาไหม?</p>
                                        <button type="button" onClick={giveKudos} disabled={kudosGiven}
                                            class={`w-full py-3 rounded-2xl font-semibold text-sm mb-3 transition ${kudosGiven ? 'bg-primary-50 text-primary-600' : 'bg-gradient-to-br from-secondary-400 to-secondary-600 text-white hover:brightness-105'}`}>
                                            {kudosGiven ? 'ส่งดาวขอบคุณแล้ว ⭐' : 'ส่งดาวขอบคุณ ⭐'}
                                        </button>
                                        <div class="mb-1 text-xs text-ink-400">ให้คะแนนการพูดคุยครั้งนี้ (ไม่บังคับ)</div>
                                        <div class="flex justify-center gap-1 mb-3">
                                            {[1,2,3,4,5].map(n => (
                                                <button key={n} type="button" onClick={() => submitRating(n)}
                                                    class={`text-2xl transition active:scale-90 ${n <= ratingGiven ? '' : 'grayscale opacity-40 hover:opacity-70'}`}>⭐</button>
                                            ))}
                                        </div>
                                        <div class="grid grid-cols-2 gap-2 mt-2">
                                            <button type="button" onClick={() => setShowEndConfirm(false)} class="py-2.5 rounded-xl border border-line font-medium text-sm text-ink-700 hover:bg-paper-100 transition">อยู่คุยต่อ</button>
                                            <button type="button" onClick={() => setEndStep('mood')} class="py-2.5 rounded-xl bg-ink-900 text-white font-medium text-sm hover:bg-primary-600 transition">ไปต่อ →</button>
                                        </div>
                                    </>
                                )}

                                {endStep === 'mood' && (
                                    <>
                                        <div class="text-3xl mb-2">🌈</div>
                                        <h3 class="text-lg font-bold mb-1 text-ink-900">หลังได้คุยวันนี้ รู้สึกยังไงบ้าง?</h3>
                                        <p class="text-xs text-ink-400 mb-5">เก็บเป็นบันทึกส่วนตัวของคุณเท่านั้น ไม่มีใครเห็น</p>
                                        <div class="flex justify-between gap-1 mb-5">
                                            {MOODS.map(m => (
                                                <button key={m.score} type="button" onClick={() => chooseAfterMood(m.score)}
                                                    class="flex-1 flex flex-col items-center gap-1 py-2 rounded-2xl hover:bg-paper-100 transition active:scale-90">
                                                    <span class="text-3xl">{m.emoji}</span>
                                                    <span class="text-[10px] text-ink-400">{m.label}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <button type="button" onClick={() => setEndStep('farewell')} class="text-xs text-ink-400 hover:text-primary-600 transition">ข้ามขั้นตอนนี้</button>
                                    </>
                                )}

                                {endStep === 'farewell' && (
                                    <>
                                        <div class="relative flex justify-center mb-3" style={{ height: '76px' }}>
                                            {/* ดาวลอยขึ้น */}
                                            {[0,1,2,3,4].map(i => (
                                                <span key={i} class="absolute text-xl float-star" style={{ left: (18 + i * 16) + '%', bottom: '8px', animationDelay: (i * 0.35) + 's' }}>⭐</span>
                                            ))}
                                            {/* เทียน */}
                                            <div class="relative flex flex-col items-center" style={{ zIndex: 2 }}>
                                                <span class="text-3xl flame">🕯️</span>
                                            </div>
                                        </div>
                                        <h3 class="text-lg font-bold mb-1 text-ink-900 warmth-pop">ขอบคุณที่แบ่งปันน้ำใจกันวันนี้</h3>
                                        <p class="text-sm text-ink-400 mb-4">{togetherLabel || 'พื้นที่นี้จะอยู่ตรงนี้เสมอ'} · เดินทางปลอดภัยนะ 🕊️</p>
                                        <button type="button" onClick={toggleSavePartner}
                                            class={`w-full py-2.5 rounded-2xl text-sm font-medium mb-3 border transition ${savedPartner ? 'bg-primary-50 text-primary-600 border-primary-200' : 'bg-surface text-ink-600 border-line hover:border-primary-300'}`}>
                                            {savedPartner ? 'บันทึกคู่คุยคนนี้ไว้แล้ว 🔖' : 'บันทึกคู่คุยคนนี้ไว้ 🔖'}
                                        </button>
                                        {savedPartner && <p class="text-[11px] text-ink-400 mb-3 -mt-1">ถ้าอีกฝ่ายบันทึกคุณด้วย จะชวนกลับมาคุยกันใหม่ได้จากหน้าแรก</p>}
                                        {heavySession && room && user && room.listener_id === user.id && (
                                            <div class="bg-secondary-50 border border-secondary-100 rounded-2xl p-4 mb-3 text-left">
                                                <div class="text-sm font-semibold text-secondary-600 mb-1">🫂 ดูแลใจตัวเองด้วยนะ</div>
                                                <p class="text-xs text-ink-500 mb-2">วันนี้คุณรับฟังเรื่องที่หนักพอสมควร ขอบคุณที่อยู่ตรงนั้นให้เขา · การรับฟังเรื่องหนักใช้พลังใจเยอะ ลองหายใจลึกๆ ดื่มน้ำ แล้วให้เวลาตัวเองสักครู่</p>
                                                {restedToday ? (
                                                    <span class="text-xs text-primary-600 font-medium">ตั้งค่าพักวันนี้แล้ว 🌿</span>
                                                ) : (
                                                    <button type="button" onClick={() => { const e = new Date(); e.setHours(23,59,59,0); try { localStorage.setItem('nomgi_rest_until', String(e.getTime())); } catch(x){} setRestedToday(true); }}
                                                        class="text-xs text-secondary-600 font-medium hover:underline">พักการรับฟังวันนี้ →</button>
                                                )}
                                            </div>
                                        )}
                                        <textarea value={reflectNote} onChange={e => setReflectNote(e.target.value.slice(0, 500))} rows="2"
                                            placeholder="จดสิ่งที่ได้เรียนรู้/รู้สึกวันนี้ (ไม่บังคับ · เก็บเป็นของคุณคนเดียว)"
                                            class="w-full text-sm bg-paper-50 border border-line rounded-2xl px-4 py-3 mb-4 resize-none focus:outline-none focus:ring-2 focus:ring-primary-500/30 placeholder:text-ink-300" />
                                        <button type="button" onClick={finalizeAndEnd} class="btn-farewell w-full py-3 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white font-semibold text-sm hover:brightness-105 transition">
                                            ปิดบทสนทนาอย่างอบอุ่น
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
